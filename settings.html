<!DOCTYPE html>
<html>
<head>
    <title>Settings - Sigma Jello</title>

    <style>
        body {
            margin: 0;
            background: url("assets/backround.png") center center / cover no-repeat fixed;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 35px;
        }

        .setting {
            background: #222;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px 20px;
            margin: 10px;
            width: 300px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-name {
            font-size: 18px;
        }

        /* Toggle switch */

        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: #555;
            border-radius: 30px;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #777;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Back Button */

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;

            width: 65px;
            height: 65px;

            padding: 0;
            margin: 0;

            border-radius: 50%;
            border: none;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
        }

        .back-button:hover {
            width: 115px;
            background: #ddd;
            transform: scale(1.08);
            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;
            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Settings</h1>

        <!-- Auto Cloak -->
        <div class="setting">
            <span class="setting-name">Auto Cloak</span>

            <label class="switch">
                <input type="checkbox" id="autoCloak">
                <span class="slider"></span>
            </label>
        </div>

        <!-- No Tab Close -->
        <div class="setting">
            <span class="setting-name">No Tab Close</span>

            <label class="switch">
                <input type="checkbox" id="noTabClose">
                <span class="slider"></span>
            </label>
        </div>

    </div>

    <!-- Back Button -->

    <button class="back-button" onclick="location.href='index.html'">
        <span class="back-letter">←</span>
        <span class="back-text">Back</span>
    </button>


    <script>

        /* =========================
           AUTO CLOAK
           ========================= */

        const autoCloak =
            document.getElementById("autoCloak");


        autoCloak.addEventListener("change", function() {

            if (this.checked) {

                /*
                 * Automatically detect the current
                 * URL instead of using a hard-coded URL.
                 */

                const currentURL =
                    window.location.href;


                /*
                 * Open a blank window.
                 */

                const cloakWindow =
                    window.open("about:blank", "_blank");


                if (cloakWindow) {

                    cloakWindow.document.open();

                    cloakWindow.document.write(`
                        <!DOCTYPE html>
                        <html>

                        <head>
                            <title>Sigma Jello</title>

                            <style>
                                html, body {
                                    margin: 0;
                                    padding: 0;
                                    width: 100%;
                                    height: 100%;
                                    overflow: hidden;
                                    background: #000;
                                }

                                iframe {
                                    width: 100%;
                                    height: 100%;
                                    border: none;
                                }
                            </style>
                        </head>

                        <body>

                            <iframe
                                src="${currentURL}"
                                allowfullscreen>
                            </iframe>

                        </body>

                        </html>
                    `);

                    cloakWindow.document.close();

                } else {

                    alert(
                        "Your browser blocked the popup. Allow popups for this site."
                    );

                    this.checked = false;
                }

            }

        });


        /* =========================
           NO TAB CLOSE
           ========================= */

        const noTabClose =
            document.getElementById("noTabClose");


        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        /* Load saved setting */

        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            noTabClose.checked = true;

            enableNoTabClose();

        }


        /* Save setting when changed */

        noTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );

    </script>

</body>
</html>
