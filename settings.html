<!DOCTYPE html>
<html>
<head>
    <title>Settings - Sigma Jello</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 35px;
        }

        .setting {
            background: #222;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px 20px;
            margin: 10px;
            width: 300px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-name {
            font-size: 18px;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: #555;
            border-radius: 30px;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #777;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        button {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 12px 30px;
            margin-top: 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Settings</h1>

        <!-- Auto Cloak -->
        <div class="setting">
            <span class="setting-name">Auto Cloak</span>

            <label class="switch">
                <input type="checkbox" id="autoCloak">
                <span class="slider"></span>
            </label>
        </div>

        <!-- No Tab Close -->
        <div class="setting">
            <span class="setting-name">No Tab Close</span>

            <label class="switch">
                <input type="checkbox" id="noTabClose">
                <span class="slider"></span>
            </label>
        </div>

        <button onclick="location.href='index.html'">Back</button>

    </div>

    <script>
        /* =========================
           AUTO CLOAK
           ========================= */

        const autoCloak = document.getElementById("autoCloak");

        autoCloak.addEventListener("change", function() {

            if (this.checked) {

                const cloakWindow = window.open("about:blank", "_blank");

                if (cloakWindow) {

                    cloakWindow.document.open();

                    cloakWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Google</title>

                            <style>
                                html, body {
                                    margin: 0;
                                    padding: 0;
                                    width: 100%;
                                    height: 100%;
                                    overflow: hidden;
                                }

                                iframe {
                                    width: 100%;
                                    height: 100%;
                                    border: none;
                                }
                            </style>
                        </head>

                        <body>
                            <iframe src="https://codehs.com/sandbox/nbayoungboy69/sigma?filepath=index.html"></iframe>
                        </body>
                        </html>
                    `);

                    cloakWindow.document.close();

                } else {

                    alert("Your browser blocked the popup. Allow popups for this site.");
                    this.checked = false;
                }
            }
        });


        /* =========================
           NO TAB CLOSE
           ========================= */

        const noTabClose = document.getElementById("noTabClose");

        function enableNoTabClose() {
            window.onbeforeunload = function(event) {
                event.preventDefault();
                event.returnValue = "";
                return "";
            };
        }

        function disableNoTabClose() {
            window.onbeforeunload = null;
        }


        /* Load saved setting */

        if (localStorage.getItem("noTabClose") === "true") {
            noTabClose.checked = true;
            enableNoTabClose();
        }


        /* Save setting when changed */

        noTabClose.addEventListener("change", function() {

            if (this.checked) {

                localStorage.setItem("noTabClose", "true");
                enableNoTabClose();

            } else {

                localStorage.setItem("noTabClose", "false");
                disableNoTabClose();

            }
        });

    </script>

</body>
</html>
