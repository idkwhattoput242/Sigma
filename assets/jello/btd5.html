<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bloons Tower Defense 5</title>

    <script src="https://agi.armorgames.com/ruffle/ruffle.js"></script>

    <style>
        html, body {
            height: 100%;
            background-color: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #flashContent {
            width: 100%;
            height: 100%;
        }

        /* =========================
           BACK BUTTON
           ========================= */

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10000;

            width: 65px;
            height: 65px;

            padding: 0;
            margin: 0;

            border-radius: 50%;
            border: none;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
        }

        .back-button:hover {
            width: 115px;
            background: #ddd;
            transform: scale(1.08);
            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;
            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }

        /* =========================
           QUICK SETTINGS
           ========================= */

        .quick-settings {
            display: none;
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 99999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;

            background: white;
            color: black;

            border-radius: 6px;
            padding: 25px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65);

            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px 0;

            font-size: 25px;
            font-weight: bold;

            color: black;
        }

        .quick-setting {
            background: #f2f2f2;

            border: 1px solid #ddd;
            border-radius: 5px;

            padding: 15px;
            margin-bottom: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: black;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }

        .hint {
            margin: 18px 0 0 0;

            color: #777;

            font-size: 13px;
            text-align: center;
        }

        /* =========================
           TOGGLE
           ========================= */

        .switch {
            position: relative;
            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #cfcfcf;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 19px;
            height: 19px;

            left: 3px;
            bottom: 3px;

            background: white;

            border-radius: 50%;

            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        /* =========================
           ANIMATION
           ========================= */

        @keyframes clickguiOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Back to Games Page -->

    <button
        class="back-button"
        onclick="location.href='../../games.html'">

        <span class="back-letter">
            ←
        </span>

        <span class="back-text">
            Back
        </span>

    </button>


    <!-- BTD5 -->

    <div id="flashContent">

        <object
            type="application/x-shockwave-flash"
            data="flash/Bloons-Tower-Defense-5.swf"
            width="100%"
            height="100%"
        >

            <param
                name="movie"
                value="flash/Bloons-Tower-Defense-5.swf">

            <param name="quality" value="high">
            <param name="bgcolor" value="#000000">
            <param name="play" value="true">
            <param name="loop" value="true">
            <param name="wmode" value="window">
            <param name="scale" value="default">
            <param name="menu" value="true">
            <param name="devicefont" value="false">
            <param name="allowScriptAccess" value="sameDomain">

        </object>

    </div>


    <!-- Quick Settings Overlay -->

    <div
        id="quickSettings"
        class="quick-settings">

        <div class="quick-settings-box">

            <h2>Settings</h2>


            <!-- No Tab Close -->

            <div class="quick-setting">

                <span>
                    No Tab Close
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickNoTabClose">

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Full Screen -->

            <div class="quick-setting">

                <span>
                    Full Screen
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickFullscreen">

                    <span class="slider"></span>

                </label>

            </div>


            <p class="hint">
                Press P to close
            </p>

        </div>

    </div>


    <script>

        /* =========================
           QUICK SETTINGS
           ========================= */

        const quickSettings =
            document.getElementById("quickSettings");

        const quickNoTabClose =
            document.getElementById("quickNoTabClose");

        const quickFullscreen =
            document.getElementById("quickFullscreen");


        /* =========================
           NO TAB CLOSE
           ========================= */

        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        /* Load saved setting */

        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            quickNoTabClose.checked = true;

            enableNoTabClose();

        }


        /* Save setting */

        quickNoTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* =========================
           FULL SCREEN
           ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (
                        document.fullscreenElement
                    ) {

                        document.exitFullscreen();

                    }

                }

            }
        );


        /* Keep Full Screen synced */

        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );


        /* =========================
           P KEY
           ========================= */

        window.addEventListener(
            "keydown",
            function(event) {

                if (event.code === "KeyP") {

                    if (event.repeat)
                        return;

                    event.preventDefault();

                    quickSettings.classList.toggle(
                        "show"
                    );

                }

            }
        );


        /* =========================
           CLICK OUTSIDE TO CLOSE
           ========================= */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
