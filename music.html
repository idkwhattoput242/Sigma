<!DOCTYPE html>
<html>
<head>
    <title>Jello Music</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================
           MOVING BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: -40px;

            background:
                url("assets/backroundjello.png")
                center center / cover no-repeat;

            z-index: 0;

            transform: translate(0px, 0px);

            transition:
                transform 0.15s ease-out;

            pointer-events: none;
        }

        /* =========================
           MUSIC CONTAINER
        ========================= */

        .music-container {
            position: relative;
            z-index: 1;

            width: 850px;
            max-width: calc(100% - 40px);

            margin: 0 auto;
            padding: 70px 0 120px;
        }

        /* =========================
           TITLE
        ========================= */

        .title {
            font-size: 55px;
            font-weight: 500;
            letter-spacing: -3px;

            margin: 0 0 30px;

            text-align: center;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.5);
        }

        /* =========================
           PLAYER
        ========================= */

        .player {
            background: rgba(255, 255, 255, 0.95);
            color: black;

            border-radius: 10px;

            padding: 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);

            margin-bottom: 20px;
        }

        .now-playing {
            text-align: center;

            font-size: 22px;
            font-weight: bold;

            margin-bottom: 20px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .time-row {
            display: flex;
            justify-content: space-between;

            font-size: 12px;
            color: #666;

            margin-bottom: 5px;
        }

        .progress {
            width: 100%;
            height: 7px;

            appearance: none;
            -webkit-appearance: none;

            background: #ddd;

            border-radius: 10px;

            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;

            width: 16px;
            height: 16px;

            background: #111;

            border-radius: 50%;

            cursor: pointer;
        }

        .progress::-moz-range-thumb {
            width: 16px;
            height: 16px;

            background: #111;

            border: none;
            border-radius: 50%;

            cursor: pointer;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 12px;

            margin-top: 20px;
        }

        .control-button {
            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background: #eee;
            color: black;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .control-button:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        .play-button {
            width: 60px;
            height: 60px;

            background: #111;
            color: white;

            font-size: 23px;
        }

        .play-button:hover {
            background: #333;
        }

        .active {
            background: #111;
            color: white;
        }

        /* =========================
           VOLUME
        ========================= */

        .volume-container {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-top: 18px;
        }

        .volume-container span {
            font-size: 18px;
        }

        .volume {
            width: 130px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search {
            width: 100%;
            box-sizing: border-box;

            padding: 14px 16px;

            margin-bottom: 15px;

            border: none;
            outline: none;

            border-radius: 7px;

            background: white;
            color: black;

            font-size: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* =========================
           SONG LIST
        ========================= */

        .song-list {
            background: rgba(255, 255, 255, 0.95);
            color: black;

            border-radius: 10px;

            padding: 10px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);
        }

        .song {
            display: flex;

            align-items: center;

            padding: 14px 16px;

            border-radius: 6px;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .song:hover {
            background: #eee;
            transform: translateX(3px);
        }

        .song.playing {
            background: #111;
            color: white;
        }

        .song-number {
            width: 40px;

            color: #888;

            font-size: 14px;
        }

        .song.playing .song-number {
            color: #aaa;
        }

        .song-name {
            flex: 1;

            font-size: 15px;
            font-weight: bold;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;

            width: 65px;
            height: 65px;

            padding: 0;

            border-radius: 50%;
            border: none;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;

            z-index: 10;
        }

        .back-button:hover {
            width: 115px;
            background: #ddd;
            transform: scale(1.08);
            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;
            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }

        /* =========================
           QUICK SETTINGS
        ========================= */

        .quick-settings {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;

            background: white;
            color: black;

            border-radius: 6px;

            padding: 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);

            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px;

            font-size: 25px;
        }

        .quick-setting {
            background: #f2f2f2;

            border: 1px solid #ddd;

            border-radius: 5px;

            padding: 15px;

            margin-bottom: 10px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }

        /* =========================
           TOGGLE
        ========================= */

        .switch {
            position: relative;

            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;

            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #cfcfcf;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 19px;
            height: 19px;

            left: 3px;
            bottom: 3px;

            background: white;

            border-radius: 50%;

            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        /* =========================
           HINT
        ========================= */

        .hint {
            margin: 18px 0 0;

            color: #777;

            font-size: 13px;

            text-align: center;
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes clickguiOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .music-container {
                width: calc(100% - 25px);
                padding-top: 35px;
            }

            .title {
                font-size: 45px;
            }

            .player {
                padding: 18px;
            }

        }

    </style>
</head>

<body>

    <!-- MOVING BACKGROUND -->

    <div
        id="background"
        class="background"
    ></div>


    <!-- MUSIC -->

    <div class="music-container">

        <h1 class="title">
            Jello Music
        </h1>


        <!-- PLAYER -->

        <div class="player">

            <div
                id="nowPlaying"
                class="now-playing"
            >
                Select a song
            </div>


            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


            <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >


            <div class="controls">

                <button
                    id="shuffleButton"
                    class="control-button"
                    title="Shuffle"
                >
                    🔀
                </button>

                <button
                    id="previousButton"
                    class="control-button"
                    title="Previous"
                >
                    ⏮
                </button>

                <button
                    id="playButton"
                    class="control-button play-button"
                    title="Play"
                >
                    ▶
                </button>

                <button
                    id="nextButton"
                    class="control-button"
                    title="Next"
                >
                    ⏭
                </button>

                <button
                    id="repeatButton"
                    class="control-button"
                    title="Repeat"
                >
                    🔁
                </button>

            </div>


            <div class="volume-container">

                <span>
                    🔊
                </span>

                <input
                    id="volume"
                    class="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>

        </div>


        <!-- SEARCH -->

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search songs..."
            autocomplete="off"
        >


        <!-- SONG LIST -->

        <div
            id="songList"
            class="song-list"
        ></div>

    </div>


    <!-- AUDIO -->

    <audio id="audio"></audio>


    <!-- BACK BUTTON -->

    <button
        class="back-button"
        onclick="location.href='index.html'"
    >
        <span class="back-letter">←</span>
        <span class="back-text">Back</span>
    </button>


    <!-- QUICK SETTINGS -->

    <div
        id="quickSettings"
        class="quick-settings"
    >

        <div class="quick-settings-box">

            <h2>Settings</h2>


            <!-- No Tab Close -->

            <div class="quick-setting">

                <span>No Tab Close</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickNoTabClose"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Full Screen -->

            <div class="quick-setting">

                <span>Full Screen</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickFullscreen"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Mouse Background Movement -->

            <div class="quick-setting">

                <span>Mouse Background Movement</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickMouseBackground"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <p class="hint">
                Press P to close
            </p>

        </div>

    </div>


    <script>

        /* =========================
           SONGS
        ========================= */

        const songs = [

            "1. Bad Boy OG.mp3",
            "1. Matt Hardy 999 OG.mp3",
            "10. Boomerang.mp3",
            "10. Nuketown OG.mp3",
            "11. Blue Cash.mp3",
            "2. Back And Forth (Stumblin_).mp3",
            "2. Baguettes.mp3",
            "2. Tell Me You Love Me OG.mp3",
            "3. Bity.mp3",
            "3. Trifling.mp3",
            "3. Vicehurt (R.I.P. Jahseh).mp3",
            "4. Hey Mister.mp3",
            "4. Infrared.mp3",
            "4. No Jumper (I Wonder Why).mp3",
            "5. Knuck If You Buck.mp3",
            "6. 2 Seats (Both Sides).mp3",
            "6. Takeover.mp3",
            "6. Wake Up!.mp3",
            "7. Catch Up (Osama).mp3",
            "7. Sky High.mp3",
            "8. Knight Crawler OG.mp3",
            "9. Bye Bye Baby.mp3",
            "9. U Can_t Tell Me.mp3",
            "Bottle.mp3",
            "Burner.mp3",
            "Cake - Juice WRLD .mp3",
            "Call Me Whenever - Juice WRLD .mp3",
            "Cursed.mp3",
            "Dark Tints - Juice WRLD.mp3",
            "Elevate - Juice WRLD.mp3",
            "Emotional Overdose.mp3",
            "Fall in love - Juice WRLD.mp3",
            "Happy Life - Juice WRLD.mp3",
            "Hypnotic.mp3",
            "In The Mix (Be Here) - Juice WRLD.mp3",
            "Tic Tac Toe - Juice WRLD.mp3",
            "Usd - Juice WRLD.mp3",
            "cali girl.mp3"

        ];


        /* =========================
           ELEMENTS
        ========================= */

        const audio =
            document.getElementById("audio");

        const songList =
            document.getElementById("songList");

        const search =
            document.getElementById("search");

        const nowPlaying =
            document.getElementById("nowPlaying");

        const playButton =
            document.getElementById("playButton");

        const previousButton =
            document.getElementById("previousButton");

        const nextButton =
            document.getElementById("nextButton");

        const shuffleButton =
            document.getElementById("shuffleButton");

        const repeatButton =
            document.getElementById("repeatButton");

        const progress =
            document.getElementById("progress");

        const currentTime =
            document.getElementById("currentTime");

        const duration =
            document.getElementById("duration");

        const volume =
            document.getElementById("volume");


        let currentIndex = 0;
        let isShuffle = false;
        let isRepeat = false;


        /* =========================
           FORMAT TIME
        ========================= */

        function formatTime(seconds) {

            if (!Number.isFinite(seconds)) {
                return "0:00";
            }

            const minutes =
                Math.floor(seconds / 60);

            const remaining =
                Math.floor(seconds % 60)
                    .toString()
                    .padStart(2, "0");

            return minutes + ":" + remaining;

        }


        /* =========================
           SONG LIST
        ========================= */

        function renderSongs(filter = "") {

            songList.innerHTML = "";

            const filteredSongs =
                songs.filter(function(song) {

                    return song
                        .toLowerCase()
                        .includes(
                            filter.toLowerCase()
                        );

                });


            filteredSongs.forEach(
                function(song) {

                    const originalIndex =
                        songs.indexOf(song);

                    const item =
                        document.createElement("div");

                    item.className = "song";


                    if (
                        originalIndex === currentIndex
                    ) {

                        item.classList.add("playing");

                    }


                    const number =
                        document.createElement("div");

                    number.className =
                        "song-number";

                    number.textContent =
                        originalIndex + 1;


                    const name =
                        document.createElement("div");

                    name.className =
                        "song-name";

                    name.textContent =
                        song.replace(".mp3", "");


                    item.appendChild(number);
                    item.appendChild(name);


                    item.addEventListener(
                        "click",
                        function() {

                            loadSong(
                                originalIndex,
                                true
                            );

                        }
                    );


                    songList.appendChild(item);

                }
            );

        }


        /* =========================
           LOAD SONG
        ========================= */

        function loadSong(index, autoplay = false) {

            if (!songs[index]) {
                return;
            }

            currentIndex = index;

            const song =
                songs[currentIndex];

            audio.src =
                "music/" +
                encodeURIComponent(song);

            nowPlaying.textContent =
                song.replace(".mp3", "");


            renderSongs(search.value);


            if (autoplay) {

                audio.play()
                    .then(function() {

                        playButton.textContent =
                            "⏸";

                    })
                    .catch(function() {

                        playButton.textContent =
                            "▶";

                    });

            } else {

                playButton.textContent =
                    "▶";

            }

        }


        /* =========================
           PLAY / PAUSE
        ========================= */

        playButton.addEventListener(
            "click",
            function() {

                if (!audio.src) {

                    loadSong(0, true);

                    return;

                }


                if (audio.paused) {

                    audio.play();

                } else {

                    audio.pause();

                }

            }
        );


        audio.addEventListener(
            "play",
            function() {

                playButton.textContent =
                    "⏸";

            }
        );


        audio.addEventListener(
            "pause",
            function() {

                playButton.textContent =
                    "▶";

            }
        );


        /* =========================
           NEXT
        ========================= */

        function nextSong() {

            let nextIndex;


            if (isShuffle) {

                if (songs.length <= 1) {
                    nextIndex = currentIndex;
                } else {

                    do {

                        nextIndex =
                            Math.floor(
                                Math.random() *
                                songs.length
                            );

                    } while (
                        nextIndex === currentIndex
                    );

                }

            } else {

                nextIndex =
                    currentIndex + 1;

                if (
                    nextIndex >= songs.length
                ) {

                    nextIndex = 0;

                }

            }


            loadSong(nextIndex, true);

        }


        nextButton.addEventListener(
            "click",
            nextSong
        );


        /* =========================
           PREVIOUS
        ========================= */

        previousButton.addEventListener(
            "click",
            function() {

                if (audio.currentTime > 3) {

                    audio.currentTime = 0;

                    return;

                }


                let previousIndex =
                    currentIndex - 1;


                if (previousIndex < 0) {

                    previousIndex =
                        songs.length - 1;

                }


                loadSong(
                    previousIndex,
                    true
                );

            }
        );


        /* =========================
           SHUFFLE
        ========================= */

        shuffleButton.addEventListener(
            "click",
            function() {

                isShuffle =
                    !isShuffle;

                shuffleButton.classList.toggle(
                    "active",
                    isShuffle
                );

            }
        );


        /* =========================
           REPEAT
        ========================= */

        repeatButton.addEventListener(
            "click",
            function() {

                isRepeat =
                    !isRepeat;

                repeatButton.classList.toggle(
                    "active",
                    isRepeat
                );

            }
        );


        /* =========================
           SONG ENDED
        ========================= */

        audio.addEventListener(
            "ended",
            function() {

                if (isRepeat) {

                    audio.currentTime = 0;

                    audio.play();

                } else {

                    nextSong();

                }

            }
        );


        /* =========================
           PROGRESS
        ========================= */

        audio.addEventListener(
            "loadedmetadata",
            function() {

                duration.textContent =
                    formatTime(
                        audio.duration
                    );

            }
        );


        audio.addEventListener(
            "timeupdate",
            function() {

                if (!audio.duration) {
                    return;
                }


                progress.value =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;


                currentTime.textContent =
                    formatTime(
                        audio.currentTime
                    );

            }
        );


        progress.addEventListener(
            "input",
            function() {

                if (!audio.duration) {
                    return;
                }


                audio.currentTime =
                    (
                        Number(progress.value) /
                        100
                    ) * audio.duration;

            }
        );


        /* =========================
           VOLUME
        ========================= */

        volume.addEventListener(
            "input",
            function() {

                audio.volume =
                    Number(this.value);

            }
        );


        /* =========================
           SEARCH
        ========================= */

        search.addEventListener(
            "input",
            function() {

                renderSongs(this.value);

            }
        );


        /* =========================
           KEYBOARD CONTROLS
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.target.tagName ===
                    "INPUT"
                ) {

                    return;

                }


                if (event.code === "Space") {

                    event.preventDefault();

                    playButton.click();

                }


                if (event.code === "ArrowRight") {

                    if (audio.duration) {

                        audio.currentTime =
                            Math.min(
                                audio.currentTime + 5,
                                audio.duration
                            );

                    }

                }


                if (event.code === "ArrowLeft") {

                    if (audio.duration) {

                        audio.currentTime =
                            Math.max(
                                audio.currentTime - 5,
                                0
                            );

                    }

                }

            }
        );


        /* =========================
           INITIAL SONG LIST
        ========================= */

        renderSongs();


        /* =========================
           QUICK SETTINGS
        ========================= */

        const quickSettings =
            document.getElementById(
                "quickSettings"
            );

        const quickNoTabClose =
            document.getElementById(
                "quickNoTabClose"
            );

        const quickFullscreen =
            document.getElementById(
                "quickFullscreen"
            );

        const quickMouseBackground =
            document.getElementById(
                "quickMouseBackground"
            );

        const background =
            document.getElementById(
                "background"
            );


        /* =========================
           NO TAB CLOSE
        ========================= */

        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            quickNoTabClose.checked =
                true;

            enableNoTabClose();

        }


        quickNoTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* =========================
           FULL SCREEN
        ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (
                        document.fullscreenElement
                    ) {

                        document.exitFullscreen();

                    }

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );


        /* =========================
           MOUSE BACKGROUND
        ========================= */

        let mouseBackgroundEnabled =
            localStorage.getItem(
                "mouseBackground"
            ) !== "false";


        quickMouseBackground.checked =
            mouseBackgroundEnabled;


        document.addEventListener(
            "mousemove",
            function(event) {

                if (!mouseBackgroundEnabled) {
                    return;
                }


                const x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) - 0.5;


                const y =
                    (
                        event.clientY /
                        window.innerHeight
                    ) - 0.5;


                const moveX =
                    x * 35;


                const moveY =
                    y * 35;


                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;

            }
        );


        quickMouseBackground.addEventListener(
            "change",
            function() {

                mouseBackgroundEnabled =
                    this.checked;


                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );


                if (!mouseBackgroundEnabled) {

                    background.style.transform =
                        "translate(0px, 0px)";

                }

            }
        );


        /* =========================
           P KEY
        ========================= */

        window.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.code === "KeyP"
                ) {

                    if (event.repeat) {
                        return;
                    }

                    event.preventDefault();

                    quickSettings.classList.toggle(
                        "show"
                    );

                }

            }
        );


        /* =========================
           CLICK OUTSIDE
        ========================= */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
