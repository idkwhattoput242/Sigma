<!DOCTYPE html>
<html>
<head>
    <title>Jello Music</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            inset: -40px;
            background:
                url("assets/backroundjello.png")
                center center / cover no-repeat;
            z-index: 0;
            transform: translate(0px, 0px);
            transition: transform 0.15s ease-out;
            pointer-events: none;
        }

        .music-container {
            position: relative;
            z-index: 1;
            width: 900px;
            max-width: calc(100% - 30px);
            margin: 0 auto;
            padding: 55px 0 120px;
        }

        .title {
            font-size: 58px;
            font-weight: 500;
            letter-spacing: -3px;
            margin: 0 0 30px;
            text-align: center;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.65);
        }

        .player {
            background: rgba(255, 255, 255, 0.96);
            color: black;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
            margin-bottom: 18px;
        }

        .now-playing-label {
            text-align: center;
            color: #777;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .now-playing {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-info {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 10px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .progress {
            width: 100%;
            height: 7px;
            appearance: none;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #111;
            border-radius: 50%;
            cursor: pointer;
        }

        .progress::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #111;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 22px;
        }

        .control-button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #eee;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .control-button:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        .play-button {
            width: 62px;
            height: 62px;
            background: #111;
            color: white;
            font-size: 23px;
        }

        .play-button:hover {
            background: #333;
        }

        .active {
            background: #111 !important;
            color: white !important;
        }

        .repeat-one {
            position: relative;
        }

        .repeat-one::after {
            content: "1";
            position: absolute;
            right: 7px;
            bottom: 5px;
            font-size: 10px;
            font-weight: bold;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .volume-container span {
            font-size: 18px;
        }

        .volume {
            width: 150px;
        }

        .library-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 18px 0 10px;
            color: white;
        }

        .library-title {
            font-size: 20px;
            font-weight: bold;
        }

        .song-count {
            font-size: 13px;
            color: #ccc;
        }

        .search {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: none;
            outline: none;
            border-radius: 8px;
            background: white;
            color: black;
            font-size: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: none;
            border-radius: 7px;
            padding: 9px 14px;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .filter-button:hover {
            background: white;
            transform: translateY(-1px);
        }

        .filter-button.active {
            background: #111;
            color: white;
        }

        .song-list {
            background: rgba(255, 255, 255, 0.96);
            color: black;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65);
        }

        .song {
            display: flex;
            align-items: center;
            padding: 13px 12px;
            border-radius: 7px;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .song:hover {
            background: #eee;
            transform: translateX(3px);
        }

        .song.playing {
            background: #111;
            color: white;
        }

        .song-number {
            width: 38px;
            color: #888;
            font-size: 13px;
            flex-shrink: 0;
        }

        .song.playing .song-number {
            color: #aaa;
        }

        .song-name {
            flex: 1;
            font-size: 15px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .favorite-button {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #777;
            font-size: 19px;
            cursor: pointer;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .favorite-button:hover {
            background: rgba(0, 0, 0, 0.08);
            color: black;
        }

        .song.playing .favorite-button {
            color: #aaa;
        }

        .favorite-button.favorite {
            color: black;
        }

        .song.playing .favorite-button.favorite {
            color: white;
        }

        .empty-library {
            text-align: center;
            padding: 35px 15px;
            color: #777;
            font-size: 15px;
        }

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 65px;
            height: 65px;
            padding: 0;
            border-radius: 50%;
            border: none;
            background: white;
            color: black;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
            z-index: 10;
        }

        .back-button:hover {
            width: 115px;
            background: #ddd;
            transform: scale(1.08);
            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;
            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }

        .quick-settings {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;
            max-width: calc(100% - 30px);
            background: white;
            color: black;
            border-radius: 7px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65);
            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px;
            font-size: 25px;
        }

        .quick-setting {
            background: #f2f2f2;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #cfcfcf;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 19px;
            height: 19px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        @keyframes clickguiOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 700px) {

            .music-container {
                width: calc(100% - 20px);
                padding-top: 30px;
            }

            .title {
                font-size: 45px;
            }

            .player {
                padding: 18px;
            }

            .controls {
                gap: 7px;
            }

            .control-button {
                width: 43px;
                height: 43px;
            }

            .play-button {
                width: 55px;
                height: 55px;
            }

            .back-button {
                width: 55px;
                height: 55px;
                bottom: 12px;
                left: 12px;
            }

            .back-button:hover {
                width: 105px;
            }
        }
    </style>
</head>

<body>

    <div id="background" class="background"></div>

    <div class="music-container">

        <h1 class="title">Jello Music</h1>

        <div class="player">

            <div class="now-playing-label">
                Now Playing
            </div>

            <div id="nowPlaying" class="now-playing">
                Select a song
            </div>

            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <div class="controls">

                <button
                    id="shuffleButton"
                    class="control-button"
                    title="Shuffle"
                >🔀</button>

                <button
                    id="previousButton"
                    class="control-button"
                    title="Previous"
                >⏮</button>

                <button
                    id="playButton"
                    class="control-button play-button"
                    title="Play"
                >▶</button>

                <button
                    id="nextButton"
                    class="control-button"
                    title="Next"
                >⏭</button>

                <button
                    id="repeatButton"
                    class="control-button"
                    title="Repeat"
                >🔁</button>

            </div>

            <div class="volume-container">
                <span>🔊</span>

                <input
                    id="volume"
                    class="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >
            </div>

            <div id="playerInfo" class="player-info">
                0 songs
            </div>

        </div>

        <div class="library-header">
            <span class="library-title">Library</span>
            <span id="songCount" class="song-count">0 songs</span>
        </div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search songs..."
            autocomplete="off"
        >

        <div class="filters">

            <button
                id="allFilter"
                class="filter-button active"
            >
                All Songs
            </button>

            <button
                id="favoriteFilter"
                class="filter-button"
            >
                ★ Favorites
            </button>

            <button
                id="recentFilter"
                class="filter-button"
            >
                Recently Played
            </button>

        </div>

        <div id="songList" class="song-list"></div>

    </div>

    <audio id="audio" preload="metadata"></audio>

    <button
        class="back-button"
        onclick="location.href='index.html'"
    >
        <span class="back-letter">←</span>
        <span class="back-text">Back</span>
    </button>

    <div id="quickSettings" class="quick-settings">

        <div class="quick-settings-box">

            <h2>Settings</h2>

            <div class="quick-setting">

                <span>No Tab Close</span>

                <label class="switch">
                    <input
                        type="checkbox"
                        id="quickNoTabClose"
                    >
                    <span class="slider"></span>
                </label>

            </div>

            <div class="quick-setting">

                <span>Full Screen</span>

                <label class="switch">
                    <input
                        type="checkbox"
                        id="quickFullscreen"
                    >
                    <span class="slider"></span>
                </label>

            </div>

            <div class="quick-setting">

                <span>Mouse Background Movement</span>

                <label class="switch">
                    <input
                        type="checkbox"
                        id="quickMouseBackground"
                    >
                    <span class="slider"></span>
                </label>

            </div>

        </div>

    </div>

    <script>

        const songs = [
            "1. Bad Boy OG.mp3",
            "1. Matt Hardy 999 OG.mp3",
            "10. Boomerang.mp3",
            "10. Nuketown OG.mp3",
            "11. Blue Cash.mp3",
            "2. Back And Forth (Stumblin_).mp3",
            "2. Baguettes.mp3",
            "2. Tell Me You Love Me OG.mp3",
            "3. Bity.mp3",
            "3. Trifling.mp3",
            "3. Vicehurt (R.I.P. Jahseh).mp3",
            "4. Hey Mister.mp3",
            "4. Infrared.mp3",
            "4. No Jumper (I Wonder Why).mp3",
            "5. Knuck If You Buck.mp3",
            "6. 2 Seats (Both Sides).mp3",
            "6. Takeover.mp3",
            "6. Wake Up!.mp3",
            "7. Catch Up (Osama).mp3",
            "7. Sky High.mp3",
            "8. Knight Crawler OG.mp3",
            "9. Bye Bye Baby.mp3",
            "9. U Can_t Tell Me.mp3",

            "Alright - Juice WRLD.mp3",
            "Anxiety.mp3",
            "Arctic Tundra - Juice WRLD.mp3",
            "Bottle.mp3",
            "Burner.mp3",
            "Cake - Juice WRLD .mp3",
            "Call Me Whenever - Juice WRLD .mp3",
            "Cursed.mp3",
            "Dark Tints - Juice WRLD.mp3",
            "Elevate - Juice WRLD.mp3",
            "Emotional Overdose.mp3",
            "Extra - Juice WRLD.mp3",
            "Fall in love - Juice WRLD.mp3",
            "Haha - Juice WRLD.mp3",
            "Happy Life - Juice WRLD.mp3",
            "High Again.mp3",
            "Hypnotic.mp3",
            "In The Mix (Be Here) - Juice WRLD.mp3",
            "Jack and Jill - Juice WRLD.mp3",
            "Juice WRLD - Rental.mp3",
            "Juice WRLD- Underworld Unreleased Song _ Rap _ EDM _ Hiphop Music _ Rip999 _ LLJW.mp3",
            "Lost My Mind - Juice WRLD.mp3",
            "Na na na - Juice Wrld.mp3",
            "Never Switch.mp3",
            "Purple Moncler.mp3",
            "Purple Rain - Juice WRLD.mp3",
            "Scarface (Feat. Gunna).mp3",
            "Singalong.mp3",
            "Swear - Juice WRLD.mp3",
            "Tic Tac Toe - Juice WRLD.mp3",
            "Usd - Juice WRLD.mp3",
            "cali girl.mp3",
            "juice wrld bloody blade unreleased.mp3"
        ];

        const audio = document.getElementById("audio");
        const songList = document.getElementById("songList");
        const search = document.getElementById("search");
        const nowPlaying = document.getElementById("nowPlaying");
        const playButton = document.getElementById("playButton");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");
        const shuffleButton = document.getElementById("shuffleButton");
        const repeatButton = document.getElementById("repeatButton");
        const progress = document.getElementById("progress");
        const currentTime = document.getElementById("currentTime");
        const duration = document.getElementById("duration");
        const volume = document.getElementById("volume");
        const songCount = document.getElementById("songCount");
        const playerInfo = document.getElementById("playerInfo");
        const allFilter = document.getElementById("allFilter");
        const favoriteFilter = document.getElementById("favoriteFilter");
        const recentFilter = document.getElementById("recentFilter");

        let currentIndex = -1;
        let shuffleMode = false;
        let repeatMode = 0;
        let currentFilter = "all";

        let favorites = JSON.parse(
            localStorage.getItem("jelloMusicFavorites") || "[]"
        );

        let recentSongs = JSON.parse(
            localStorage.getItem("jelloMusicRecent") || "[]"
        );

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) {
                return "0:00";
            }

            const minutes = Math.floor(seconds / 60);

            const remaining = Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");

            return minutes + ":" + remaining;
        }

        function saveFavorites() {
            localStorage.setItem(
                "jelloMusicFavorites",
                JSON.stringify(favorites)
            );
        }

        function saveRecent() {
            localStorage.setItem(
                "jelloMusicRecent",
                JSON.stringify(recentSongs)
            );
        }

        function isFavorite(index) {
            return favorites.includes(songs[index]);
        }

        function addRecent(index) {
            const song = songs[index];

            recentSongs = recentSongs.filter(
                function(item) {
                    return item !== song;
                }
            );

            recentSongs.unshift(song);
            recentSongs = recentSongs.slice(0, 20);

            saveRecent();
        }

        function getFilteredIndexes() {
            const query = search.value.trim().toLowerCase();

            let indexes = songs.map(
                function(song, index) {
                    return index;
                }
            );

            if (currentFilter === "favorites") {
                indexes = indexes.filter(
                    function(index) {
                        return isFavorite(index);
                    }
                );
            }

            if (currentFilter === "recent") {
                indexes = recentSongs
                    .map(
                        function(song) {
                            return songs.indexOf(song);
                        }
                    )
                    .filter(
                        function(index) {
                            return index !== -1;
                        }
                    );
            }

            if (query) {
                indexes = indexes.filter(
                    function(index) {
                        return songs[index]
                            .toLowerCase()
                            .includes(query);
                    }
                );
            }

            return indexes;
        }

        function renderSongs() {
            songList.innerHTML = "";

            const indexes = getFilteredIndexes();

            songCount.textContent =
                indexes.length +
                (indexes.length === 1 ? " song" : " songs");

            playerInfo.textContent =
                songs.length +
                (songs.length === 1
                    ? " song in library"
                    : " songs in library");

            if (indexes.length === 0) {
                const empty = document.createElement("div");

                empty.className = "empty-library";

                if (currentFilter === "favorites") {
                    empty.textContent = "No favorite songs yet.";
                } else if (currentFilter === "recent") {
                    empty.textContent =
                        "No recently played songs yet.";
                } else {
                    empty.textContent = "No songs found.";
                }

                songList.appendChild(empty);
                return;
            }

            indexes.forEach(
                function(index) {
                    const song = songs[index];

                    const item =
                        document.createElement("div");

                    item.className = "song";

                    if (index === currentIndex) {
                        item.classList.add("playing");
                    }

                    const number =
                        document.createElement("div");

                    number.className = "song-number";
                    number.textContent = index + 1;

                    const name =
                        document.createElement("div");

                    name.className = "song-name";
                    name.textContent =
                        song.replace(/\.mp3$/i, "");

                    const favorite =
                        document.createElement("button");

                    favorite.className =
                        "favorite-button";

                    favorite.type = "button";

                    favorite.title =
                        isFavorite(index)
                            ? "Remove favorite"
                            : "Add favorite";

                    favorite.textContent =
                        isFavorite(index)
                            ? "★"
                            : "☆";

                    if (isFavorite(index)) {
                        favorite.classList.add("favorite");
                    }

                    favorite.addEventListener(
                        "click",
                        function(event) {
                            event.stopPropagation();

                            const songName =
                                songs[index];

                            if (
                                favorites.includes(songName)
                            ) {
                                favorites =
                                    favorites.filter(
                                        function(item) {
                                            return item !== songName;
                                        }
                                    );
                            } else {
                                favorites.push(songName);
                            }

                            saveFavorites();
                            renderSongs();
                        }
                    );

                    item.appendChild(number);
                    item.appendChild(name);
                    item.appendChild(favorite);

                    item.addEventListener(
                        "click",
                        function() {
                            loadSong(index, true);
                        }
                    );

                    songList.appendChild(item);
                }
            );
        }

        function loadSong(index, autoplay = false) {
            if (!songs[index]) {
                return;
            }

            currentIndex = index;

            const song = songs[currentIndex];

            audio.src =
                "music/" +
                encodeURIComponent(song);

            nowPlaying.textContent =
                song.replace(/\.mp3$/i, "");

            progress.value = 0;
            currentTime.textContent = "0:00";
            duration.textContent = "0:00";

            renderSongs();

            if (autoplay) {
                audio.play().catch(
                    function() {
                        playButton.textContent = "▶";
                    }
                );
            } else {
                playButton.textContent = "▶";
            }
        }

        function playNextSong() {
            if (songs.length === 0) {
                return;
            }

            let nextIndex;

            if (shuffleMode) {
                if (songs.length === 1) {
                    nextIndex = 0;
                } else {
                    do {
                        nextIndex =
                            Math.floor(
                                Math.random() *
                                songs.length
                            );
                    } while (
                        nextIndex === currentIndex
                    );
                }
            } else {
                nextIndex = currentIndex + 1;

                if (
                    nextIndex >= songs.length ||
                    currentIndex === -1
                ) {
                    nextIndex = 0;
                }
            }

            loadSong(nextIndex, true);
        }

        function playPreviousSong() {
            if (songs.length === 0) {
                return;
            }

            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }

            let previousIndex = currentIndex - 1;

            if (previousIndex < 0) {
                previousIndex = songs.length - 1;
            }

            loadSong(previousIndex, true);
        }

        playButton.addEventListener(
            "click",
            function() {
                if (currentIndex === -1) {
                    loadSong(0, true);
                    return;
                }

                if (audio.paused) {
                    audio.play().catch(
                        function() {}
                    );
                } else {
                    audio.pause();
                }
            }
        );

        previousButton.addEventListener(
            "click",
            playPreviousSong
        );

        nextButton.addEventListener(
            "click",
            playNextSong
        );

        shuffleButton.addEventListener(
            "click",
            function() {
                shuffleMode = !shuffleMode;

                shuffleButton.classList.toggle(
                    "active",
                    shuffleMode
                );

                localStorage.setItem(
                    "jelloMusicShuffle",
                    shuffleMode
                );
            }
        );

        repeatButton.addEventListener(
            "click",
            function() {
                repeatMode++;

                if (repeatMode > 2) {
                    repeatMode = 0;
                }

                updateRepeatButton();

                localStorage.setItem(
                    "jelloMusicRepeat",
                    repeatMode
                );
            }
        );

        function updateRepeatButton() {
            repeatButton.classList.remove(
                "active",
                "repeat-one"
            );

            if (repeatMode === 1) {
                repeatButton.classList.add(
                    "active"
                );

                repeatButton.title =
                    "Repeat All";
            } else if (repeatMode === 2) {
                repeatButton.classList.add(
                    "active",
                    "repeat-one"
                );

                repeatButton.title =
                    "Repeat One";
            } else {
                repeatButton.title =
                    "Repeat Off";
            }
        }

        audio.addEventListener(
            "play",
            function() {
                playButton.textContent = "⏸";
            }
        );

        audio.addEventListener(
            "pause",
            function() {
                playButton.textContent = "▶";
            }
        );

        audio.addEventListener(
            "ended",
            function() {
                if (repeatMode === 2) {
                    audio.currentTime = 0;
                    audio.play();
                    return;
                }

                if (
                    repeatMode === 0 &&
                    !shuffleMode &&
                    currentIndex === songs.length - 1
                ) {
                    audio.currentTime = 0;
                    playButton.textContent = "▶";
                    return;
                }

                playNextSong();
            }
        );

        audio.addEventListener(
            "loadedmetadata",
            function() {
                duration.textContent =
                    formatTime(audio.duration);
            }
        );

        audio.addEventListener(
            "timeupdate",
            function() {
                if (!audio.duration) {
                    return;
                }

                progress.value =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;

                currentTime.textContent =
                    formatTime(
                        audio.currentTime
                    );
            }
        );

        audio.addEventListener(
            "error",
            function() {
                nowPlaying.textContent =
                    "Unable to load this song";

                playButton.textContent = "▶";
            }
        );

        audio.addEventListener(
            "play",
            function() {
                if (currentIndex !== -1) {
                    addRecent(currentIndex);
                }

                renderSongs();
            }
        );

        progress.addEventListener(
            "input",
            function() {
                if (!audio.duration) {
                    return;
                }

                audio.currentTime =
                    (
                        Number(progress.value) /
                        100
                    ) * audio.duration;
            }
        );

        volume.addEventListener(
            "input",
            function() {
                audio.volume =
                    Number(this.value);

                localStorage.setItem(
                    "jelloMusicVolume",
                    this.value
                );
            }
        );

        search.addEventListener(
            "input",
            function() {
                renderSongs();
            }
        );

        allFilter.addEventListener(
            "click",
            function() {
                currentFilter = "all";
                updateFilterButtons();
                renderSongs();
            }
        );

        favoriteFilter.addEventListener(
            "click",
            function() {
                currentFilter = "favorites";
                updateFilterButtons();
                renderSongs();
            }
        );

        recentFilter.addEventListener(
            "click",
            function() {
                currentFilter = "recent";
                updateFilterButtons();
                renderSongs();
            }
        );

        function updateFilterButtons() {
            allFilter.classList.toggle(
                "active",
                currentFilter === "all"
            );

            favoriteFilter.classList.toggle(
                "active",
                currentFilter === "favorites"
            );

            recentFilter.classList.toggle(
                "active",
                currentFilter === "recent"
            );
        }

        /*
         * KEYBOARD CONTROLS
         *
         * Space = play/pause
         * Left = back 5 seconds
         * Right = forward 5 seconds
         *
         * P intentionally does NOTHING here.
         */

        document.addEventListener(
            "keydown",
            function(event) {
                if (
                    event.target.tagName === "INPUT" ||
                    event.target.tagName === "BUTTON"
                ) {
                    return;
                }

                if (event.code === "Space") {
                    event.preventDefault();
                    playButton.click();
                }

                if (event.code === "ArrowRight") {
                    if (audio.duration) {
                        audio.currentTime =
                            Math.min(
                                audio.currentTime + 5,
                                audio.duration
                            );
                    }
                }

                if (event.code === "ArrowLeft") {
                    if (audio.duration) {
                        audio.currentTime =
                            Math.max(
                                audio.currentTime - 5,
                                0
                            );
                    }
                }
            }
        );

        /*
         * RESTORE MUSIC SETTINGS
         */

        const savedVolume =
            localStorage.getItem(
                "jelloMusicVolume"
            );

        if (savedVolume !== null) {
            volume.value = savedVolume;
            audio.volume = Number(savedVolume);
        } else {
            audio.volume = 1;
        }

        const savedShuffle =
            localStorage.getItem(
                "jelloMusicShuffle"
            );

        if (savedShuffle === "true") {
            shuffleMode = true;

            shuffleButton.classList.add(
                "active"
            );
        }

        const savedRepeat =
            localStorage.getItem(
                "jelloMusicRepeat"
            );

        if (savedRepeat !== null) {
            repeatMode = Number(savedRepeat);
        }

        updateRepeatButton();

        /*
         * QUICK SETTINGS
         */

        const quickSettings =
            document.getElementById(
                "quickSettings"
            );

        const quickNoTabClose =
            document.getElementById(
                "quickNoTabClose"
            );

        const quickFullscreen =
            document.getElementById(
                "quickFullscreen"
            );

        const quickMouseBackground =
            document.getElementById(
                "quickMouseBackground"
            );

        const background =
            document.getElementById(
                "background"
            );

        function enableNoTabClose() {
            window.onbeforeunload =
                function(event) {
                    event.preventDefault();
                    event.returnValue = "";
                    return "";
                };
        }

        function disableNoTabClose() {
            window.onbeforeunload = null;
        }

        if (
            localStorage.getItem(
                "noTabClose"
            ) === "true"
        ) {
            quickNoTabClose.checked = true;
            enableNoTabClose();
        }

        quickNoTabClose.addEventListener(
            "change",
            function() {
                if (this.checked) {
                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();
                } else {
                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();
                }
            }
        );

        quickFullscreen.addEventListener(
            "change",
            function() {
                if (this.checked) {
                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {
                        document.documentElement
                            .requestFullscreen();
                    }
                } else {
                    if (
                        document.fullscreenElement
                    ) {
                        document.exitFullscreen();
                    }
                }
            }
        );

        document.addEventListener(
            "fullscreenchange",
            function() {
                quickFullscreen.checked =
                    !!document.fullscreenElement;
            }
        );

        let mouseBackgroundEnabled =
            localStorage.getItem(
                "mouseBackground"
            ) !== "false";

        quickMouseBackground.checked =
            mouseBackgroundEnabled;

        document.addEventListener(
            "mousemove",
            function(event) {
                if (!mouseBackgroundEnabled) {
                    return;
                }

                const x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) - 0.5;

                const y =
                    (
                        event.clientY /
                        window.innerHeight
                    ) - 0.5;

                const moveX = x * 35;
                const moveY = y * 35;

                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;
            }
        );

        quickMouseBackground.addEventListener(
            "change",
            function() {
                mouseBackgroundEnabled =
                    this.checked;

                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );

                if (!mouseBackgroundEnabled) {
                    background.style.transform =
                        "translate(0px, 0px)";
                }
            }
        );

        quickSettings.addEventListener(
            "click",
            function(event) {
                if (event.target === quickSettings) {
                    quickSettings.classList.remove(
                        "show"
                    );
                }
            }
        );

        /*
         * START
         */

        renderSongs();

    </script>

</body>
</html>
