<!DOCTYPE html>
<html>
<head>
    <title>Jello</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* =========================
           MOVING BACKGROUND
           ========================= */

        .background {
            position: fixed;
            inset: -40px;

            background:
                url("assets/backround.jpg")
                center center / cover no-repeat;

            z-index: 0;

            transform: translate(0px, 0px);

            transition:
                transform 0.15s ease-out;

            pointer-events: none;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* =========================
           TITLE
           ========================= */

        h1 {
            font-size: 68px;
            margin-bottom: 30px;

            font-family: Arial, sans-serif;
            font-weight: 500;
            letter-spacing: -3px;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.45);
        }

        /* =========================
           CIRCLE BUTTONS
           ========================= */

        .circle-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 10px;
        }

        .circle-button {
            width: 75px;
            height: 75px;
            padding: 0;
            margin: 5px;

            border-radius: 50%;
            background: white;
            color: black;
            border: none;

            font-size: 32px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                background 0.2s ease,
                transform 0.2s ease,
                border-radius 0.25s ease;
        }

        .circle-button:hover {
            background: #ddd;
            transform: scale(1.08);
            border-radius: 40px;
        }

        /* =========================
           ICONS
           ========================= */

        .icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .icon svg {
            width: 38px;
            height: 38px;

            display: block;

            fill: white;
            stroke: black;

            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .games-button .icon svg {
            width: 42px;
            height: 42px;
        }

        .music-button .icon svg {
            width: 40px;
            height: 40px;
        }

        .changelog-button .icon svg {
            width: 36px;
            height: 40px;
        }

        .settings-button .icon svg {
            width: 40px;
            height: 40px;
        }

        .circle-button .name {
            display: none;

            font-size: 20px;
            font-weight: bold;
        }

        .circle-button:hover .icon {
            display: none;
        }

        .circle-button:hover .name {
            display: block;
        }

        .games-button:hover {
            width: 130px;
        }

        .music-button:hover {
            width: 135px;
        }

        .changelog-button:hover {
            width: 155px;
        }

        .settings-button:hover {
            width: 140px;
        }

        /* =========================
           VERSION
           ========================= */

        .version {
            position: fixed;
            bottom: 15px;
            right: 15px;

            color: white;
            font-size: 14px;
            font-weight: bold;

            z-index: 2;
        }

        /* =========================
           LOGIN BUTTON
           ========================= */

        .login-button {
            position: fixed;
            top: 20px;
            right: 20px;

            padding: 12px 22px;

            background: white;
            color: black;

            border: none;
            border-radius: 25px;

            font-size: 16px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            cursor: pointer;

            z-index: 2;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .login-button:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        /* =========================
           HELLO USER
           ========================= */

        .hello-user {
            position: fixed;
            top: 20px;
            right: 20px;

            color: white;

            font-size: 20px;
            font-weight: bold;

            z-index: 3;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* =========================
           LOGIN POPUP
           ========================= */

        .login-popup {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 10000;
        }

        .login-popup.show {
            display: flex;
        }

        .login-popup-box {
            position: relative;

            width: 300px;

            background: white;
            color: black;

            border-radius: 8px;

            padding: 30px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);

            animation: loginPopupOpen 0.2s ease-out;
        }

        .login-popup-box h2 {
            margin: 0 0 12px 0;

            font-size: 26px;
            font-weight: bold;
        }

        .login-subtitle {
            margin: 0 0 20px 0 !important;

            font-size: 14px !important;
            color: #777 !important;
        }

        .username-label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;

            color: #222;
        }

        .username-input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            background: #f5f5f5;
            color: black;

            border: 1px solid #ccc;
            border-radius: 5px;

            outline: none;

            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .username-input:focus {
            border-color: #111;
            background: white;
        }

        .sign-in-button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            background: #111;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .sign-in-button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .login-error {
            display: none;

            margin-top: 10px;

            color: #d00000;

            font-size: 13px;
            font-weight: bold;
        }

        .close-login {
            position: absolute;

            top: 10px;
            right: 12px;

            width: 30px;
            height: 30px;

            border: none;
            border-radius: 50%;

            background: #eee;
            color: black;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close-login:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        /* =========================
           QUICK SETTINGS
           ========================= */

        .quick-settings {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;

            background: white;
            color: black;

            border-radius: 6px;

            padding: 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);

            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px 0;

            font-size: 25px;
            font-weight: bold;

            color: black;
        }

        .quick-setting {
            background: #f2f2f2;

            border: 1px solid #ddd;

            border-radius: 5px;

            padding: 15px;

            margin-bottom: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: black;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }

        /* =========================
           JELLO MUSIC BUTTON
           ========================= */

        .music-open-button {
            width: 100%;

            padding: 14px;

            margin-top: 4px;

            background: #111;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .music-open-button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        /* =========================
           TOGGLES
           ========================= */

        .switch {
            position: relative;

            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;

            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #cfcfcf;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 19px;
            height: 19px;

            left: 3px;
            bottom: 3px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        /* =========================
           MUSIC POPUP
           ========================= */

        .music-popup {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 11000;
        }

        .music-popup.show {
            display: flex;
        }

        .music-box {
            position: relative;

            width: 420px;
            max-width: calc(100vw - 40px);
            max-height: 80vh;

            background: white;
            color: black;

            border-radius: 10px;

            padding: 25px;

            box-sizing: border-box;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7);

            animation: musicPopupOpen 0.2s ease-out;
        }

        .music-box h2 {
            margin: 0;

            font-size: 25px;
            font-weight: bold;
        }

        .music-close {
            position: absolute;

            top: 12px;
            right: 12px;

            width: 32px;
            height: 32px;

            border: none;
            border-radius: 50%;

            background: #eee;
            color: black;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .music-close:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        .music-now-playing {
            margin-top: 20px;

            padding: 14px;

            background: #f2f2f2;

            border-radius: 6px;

            text-align: center;

            font-size: 15px;
            font-weight: bold;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-progress {
            width: 100%;

            margin-top: 15px;

            cursor: pointer;
        }

        .music-time {
            display: flex;
            justify-content: space-between;

            margin-top: 5px;

            font-size: 11px;
            color: #777;
        }

        .music-controls {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-top: 15px;
        }

        .music-control {
            width: 42px;
            height: 38px;

            border: none;
            border-radius: 6px;

            background: #eee;
            color: black;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .music-control:hover {
            background: #ddd;
            transform: scale(1.05);
        }

        .music-play {
            width: 50px;
            height: 44px;

            background: #111;
            color: white;
        }

        .music-play:hover {
            background: #333;
        }

        .music-options {
            display: flex;

            align-items: center;
            gap: 10px;

            margin-top: 15px;
        }

        .music-options span {
            font-size: 13px;
            font-weight: bold;
        }

        .music-volume {
            flex: 1;
        }

        .music-search {
            width: 100%;
            box-sizing: border-box;

            margin-top: 18px;

            padding: 11px;

            background: #f5f5f5;
            color: black;

            border: 1px solid #ccc;
            border-radius: 5px;

            outline: none;

            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .music-search:focus {
            border-color: #111;
            background: white;
        }

        .music-list {
            margin-top: 12px;

            max-height: 180px;

            overflow-y: auto;

            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .music-song {
            padding: 10px 12px;

            background: white;

            border-bottom: 1px solid #eee;

            cursor: pointer;

            font-size: 13px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            transition:
                background 0.15s ease;
        }

        .music-song:last-child {
            border-bottom: none;
        }

        .music-song:hover {
            background: #f0f0f0;
        }

        .music-song.active {
            background: #111;
            color: white;
        }

        .music-empty {
            padding: 15px;

            text-align: center;

            color: #777;

            font-size: 13px;
        }

        /* =========================
           HINT
           ========================= */

        .hint {
            margin: 18px 0 0 0;

            color: #777;

            font-size: 13px;

            text-align: center;
        }

        /* =========================
           ANIMATIONS
           ========================= */

        @keyframes clickguiOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes loginPopupOpen {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes musicPopupOpen {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- MOVING BACKGROUND -->

    <div id="background" class="background"></div>


    <div class="container">

        <h1>Jello</h1>

        <br>

        <div class="circle-buttons">

            <!-- GAMES -->

            <button
                class="circle-button games-button"
                onclick="location.href='games.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <path
                            d="M14 17h20c6 0 9 5 10 11l2 8c1 5-5 8-8 4l-5-6H15l-5 6c-3 4-9 1-8-4l2-8c1-6 4-11 10-11z"
                        />

                        <path
                            d="M14 24v9"
                            fill="none"
                        />

                        <path
                            d="M9.5 28.5h9"
                            fill="none"
                        />

                        <circle
                            cx="33"
                            cy="25"
                            r="2"
                        />

                        <circle
                            cx="38"
                            cy="30"
                            r="2"
                        />

                    </svg>

                </span>

                <span class="name">Games</span>

            </button>


            <!-- MUSIC -->

            <button
                class="circle-button music-button"
                onclick="location.href='music.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <path
                            d="M14 20a10 10 0 0 1 20 0v13"
                            fill="none"
                        />

                        <path
                            d="M14 27h-2a4 4 0 0 0-4 4v5a4 4 0 0 0 4 4h5V27z"
                        />

                        <path
                            d="M34 27h2a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4h-5V27z"
                        />

                        <path
                            d="M19 40h10"
                            fill="none"
                        />

                    </svg>

                </span>

                <span class="name">Music</span>

            </button>


            <!-- CHANGELOGS -->

            <button
                class="circle-button changelog-button"
                onclick="location.href='changelogs.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <path
                            d="M10 5h21l7 7v31H10z"
                        />

                        <path
                            d="M31 5v8h7"
                            fill="none"
                        />

                        <path
                            d="M17 22h15"
                            fill="none"
                        />

                        <path
                            d="M17 29h15"
                            fill="none"
                        />

                        <path
                            d="M17 36h10"
                            fill="none"
                        />

                    </svg>

                </span>

                <span class="name">Changelogs</span>

            </button>


            <!-- SETTINGS -->

            <button
                class="circle-button settings-button"
                onclick="location.href='settings.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <path
                            d="
                                M20 5
                                h8
                                l1.5 5
                                a14 14 0 0 1 4 2.3
                                l5-1.5
                                4 7
                                -4 3
                                a14 14 0 0 1 0 4.6
                                l4 3
                                -4 7
                                -5-1.5
                                a14 14 0 0 1-4 2.3
                                L28 43
                                h-8
                                l-1.5-5
                                a14 14 0 0 1-4-2.3
                                l-5 1.5
                                -4-7
                                4-3
                                a14 14 0 0 1 0-4.6
                                l-4-3
                                4-7
                                5 1.5
                                a14 14 0 0 1 4 2.3
                                z
                            "
                        />

                        <circle
                            cx="24"
                            cy="24"
                            r="6"
                        />

                    </svg>

                </span>

                <span class="name">Settings</span>

            </button>

        </div>

    </div>


    <!-- HELLO USER -->

    <div id="helloUser" class="hello-user"></div>


    <!-- LOGIN BUTTON -->

    <button
        id="loginButton"
        class="login-button"
        onclick="openLoginPopup()"
    >
        Log In
    </button>


    <!-- VERSION -->

    <div class="version">
        Alpha 2.01
    </div>


    <!-- LOGIN POPUP -->

    <div id="loginPopup" class="login-popup">

        <div class="login-popup-box">

            <button
                class="close-login"
                onclick="closeLoginPopup()"
            >
                ×
            </button>

            <h2>Log In</h2>

            <p class="login-subtitle">
                Enter a username to continue
            </p>

            <label
                class="username-label"
                for="usernameInput"
            >
                Username
            </label>

            <input
                id="usernameInput"
                class="username-input"
                type="text"
                maxlength="20"
                placeholder="Enter username"
                autocomplete="off"
            >

            <button
                class="sign-in-button"
                onclick="signIn()"
            >
                Sign In
            </button>

            <div
                id="loginError"
                class="login-error"
            >
                Please enter a username.
            </div>

        </div>

    </div>


    <!-- QUICK SETTINGS -->

    <div id="quickSettings" class="quick-settings">

        <div class="quick-settings-box">

            <h2>Settings</h2>

            <!-- AUTO CLOAK -->

            <div class="quick-setting">

                <span>Auto Cloak</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickAutoCloak"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <!-- NO TAB CLOSE -->

            <div class="quick-setting">

                <span>No Tab Close</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickNoTabClose"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <!-- FULL SCREEN -->

            <div class="quick-setting">

                <span>Full Screen</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickFullscreen"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <!-- MOUSE BACKGROUND MOVEMENT -->

            <div class="quick-setting">

                <span>Mouse Background Movement</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickMouseBackground"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <!-- JELLO MUSIC -->

            <button
                class="music-open-button"
                onclick="openMusicPopup()"
            >
                Jello Music
            </button>

            <p class="hint">
                Press P to close
            </p>

        </div>

    </div>


    <!-- =========================
         JELLO MUSIC POPUP
         ========================= -->

    <div
        id="musicPopup"
        class="music-popup"
    >

        <div class="music-box">

            <button
                class="music-close"
                onclick="closeMusicPopup()"
            >
                ×
            </button>

            <h2>Jello Music</h2>

            <div
                id="musicNowPlaying"
                class="music-now-playing"
            >
                Nothing playing
            </div>

            <input
                id="musicProgress"
                class="music-progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <div class="music-time">

                <span id="musicCurrentTime">
                    0:00
                </span>

                <span id="musicDuration">
                    0:00
                </span>

            </div>

            <div class="music-controls">

                <button
                    id="musicPrevious"
                    class="music-control"
                    title="Previous"
                >
                    ⏮
                </button>

                <button
                    id="musicPlay"
                    class="music-control music-play"
                    title="Play / Pause"
                >
                    ▶
                </button>

                <button
                    id="musicNext"
                    class="music-control"
                    title="Next"
                >
                    ⏭
                </button>

                <button
                    id="musicShuffle"
                    class="music-control"
                    title="Shuffle"
                >
                    🔀
                </button>

                <button
                    id="musicRepeat"
                    class="music-control"
                    title="Repeat"
                >
                    🔁
                </button>

            </div>

            <div class="music-options">

                <span>Volume</span>

                <input
                    id="musicVolume"
                    class="music-volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>

            <input
                id="musicSearch"
                class="music-search"
                type="text"
                placeholder="Search songs..."
                autocomplete="off"
            >

            <div
                id="musicList"
                class="music-list"
            ></div>

        </div>

    </div>


    <!-- AUDIO -->

    <audio id="musicAudio"></audio>


    <script>

        /* =========================
           ELEMENTS
           ========================= */

        const quickSettings =
            document.getElementById("quickSettings");

        const quickAutoCloak =
            document.getElementById("quickAutoCloak");

        const quickNoTabClose =
            document.getElementById("quickNoTabClose");

        const quickFullscreen =
            document.getElementById("quickFullscreen");

        const quickMouseBackground =
            document.getElementById("quickMouseBackground");

        const loginPopup =
            document.getElementById("loginPopup");

        const usernameInput =
            document.getElementById("usernameInput");

        const loginError =
            document.getElementById("loginError");

        const loginButton =
            document.getElementById("loginButton");

        const helloUser =
            document.getElementById("helloUser");

        const background =
            document.getElementById("background");


        /* =========================
           LOGIN
           ========================= */

        function openLoginPopup() {

            loginPopup.classList.add("show");

            usernameInput.value = "";

            loginError.style.display = "none";

            setTimeout(function() {

                usernameInput.focus();

            }, 50);

        }


        function closeLoginPopup() {

            loginPopup.classList.remove("show");

        }


        function signIn() {

            const username =
                usernameInput.value.trim();


            if (!username) {

                loginError.style.display =
                    "block";

                usernameInput.focus();

                return;

            }


            localStorage.setItem(
                "sigmaJelloUsername",
                username
            );


            localStorage.setItem(
                "sigmaJelloLoggedIn",
                "true"
            );


            updateUserDisplay();

            closeLoginPopup();

        }


        function updateUserDisplay() {

            const username =
                localStorage.getItem(
                    "sigmaJelloUsername"
                );


            const loggedIn =
                localStorage.getItem(
                    "sigmaJelloLoggedIn"
                ) === "true";


            if (loggedIn && username) {

                helloUser.textContent =
                    "Hello " + username;

                helloUser.style.display =
                    "block";

                loginButton.style.display =
                    "none";

            } else {

                helloUser.textContent = "";

                helloUser.style.display =
                    "none";

                loginButton.style.display =
                    "block";

            }

        }


        updateUserDisplay();


        usernameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    signIn();

                }

            }
        );


        usernameInput.addEventListener(
            "input",
            function() {

                loginError.style.display =
                    "none";

            }
        );


        loginPopup.addEventListener(
            "click",
            function(event) {

                if (event.target === loginPopup) {

                    closeLoginPopup();

                }

            }
        );


        /* =========================
           NO TAB CLOSE
           ========================= */

        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            quickNoTabClose.checked = true;

            enableNoTabClose();

        }


        quickNoTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* =========================
           AUTO CLOAK
           ========================= */

        quickAutoCloak.addEventListener(
            "change",
            function() {

                if (!this.checked) {
                    return;
                }

                const currentURL =
                    window.location.href;

                const cloakWindow =
                    window.open(
                        "about:blank",
                        "_blank"
                    );

                if (!cloakWindow) {

                    alert(
                        "Your browser blocked the popup. Allow popups for this site."
                    );

                    this.checked = false;

                    return;
                }

                cloakWindow.document.open();

                cloakWindow.document.write(`

                    <!DOCTYPE html>

                    <html>

                    <head>

                        <title>about:blank</title>

                        <style>

                            html,
                            body {

                                margin: 0;
                                padding: 0;

                                width: 100%;
                                height: 100%;

                                overflow: hidden;

                                background: black;

                            }

                            iframe {

                                width: 100%;
                                height: 100%;

                                border: none;

                            }

                        </style>

                    </head>

                    <body>

                        <iframe
                            src="${currentURL}"
                            allowfullscreen>
                        </iframe>

                    </body>

                    </html>

                `);

                cloakWindow.document.close();

            }
        );


        /* =========================
           FULL SCREEN
           ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (document.fullscreenElement) {

                        document.exitFullscreen();

                    }

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );


        /* =========================
           MOUSE BACKGROUND MOVEMENT
           ========================= */

        let mouseBackgroundEnabled =
            localStorage.getItem("mouseBackground")
            !== "false";


        quickMouseBackground.checked =
            mouseBackgroundEnabled;


        document.addEventListener(
            "mousemove",
            function(event) {

                if (!mouseBackgroundEnabled) {
                    return;
                }

                const x =
                    (event.clientX / window.innerWidth)
                    - 0.5;

                const y =
                    (event.clientY / window.innerHeight)
                    - 0.5;

                const moveX =
                    x * 35;

                const moveY =
                    y * 35;

                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;

            }
        );


        quickMouseBackground.addEventListener(
            "change",
            function() {

                mouseBackgroundEnabled =
                    this.checked;

                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );

                if (!mouseBackgroundEnabled) {

                    background.style.transform =
                        "translate(0px, 0px)";

                }

            }
        );


        /* =========================
           MUSIC PLAYER
           ========================= */

        const musicPopup =
            document.getElementById("musicPopup");

        const musicAudio =
            document.getElementById("musicAudio");

        const musicNowPlaying =
            document.getElementById("musicNowPlaying");

        const musicProgress =
            document.getElementById("musicProgress");

        const musicCurrentTime =
            document.getElementById("musicCurrentTime");

        const musicDuration =
            document.getElementById("musicDuration");

        const musicPlay =
            document.getElementById("musicPlay");

        const musicPrevious =
            document.getElementById("musicPrevious");

        const musicNext =
            document.getElementById("musicNext");

        const musicShuffle =
            document.getElementById("musicShuffle");

        const musicRepeat =
            document.getElementById("musicRepeat");

        const musicVolume =
            document.getElementById("musicVolume");

        const musicSearch =
            document.getElementById("musicSearch");

        const musicList =
            document.getElementById("musicList");


        const songs = [

            "1. Bad Boy OG.mp3",
            "1. Matt Hardy 999 OG.mp3",
            "10. Boomerang.mp3",
            "10. Nuketown OG.mp3",
            "11. Blue Cash.mp3",
            "2. Back And Forth (Stumblin_).mp3",
            "2. Baguettes.mp3",
            "2. Tell Me You Love Me OG.mp3",
            "3. Bity.mp3",
            "3. Trifling.mp3",
            "3. Vicehurt (R.I.P. Jahseh).mp3",
            "4. Hey Mister.mp3",
            "4. Infrared.mp3",
            "4. No Jumper (I Wonder Why).mp3",
            "5. Knuck If You Buck.mp3",
            "6. 2 Seats (Both Sides).mp3",
            "6. Takeover.mp3",
            "6. Wake Up!.mp3",
            "7. Catch Up (Osama).mp3",
            "7. Sky High.mp3",
            "8. Knight Crawler OG.mp3",
            "9. Bye Bye Baby.mp3",
            "9. U Can_t Tell Me.mp3",
            "Bottle.mp3",
            "Burner.mp3",
            "Cake - Juice WRLD .mp3",
            "Call Me Whenever - Juice WRLD .mp3",
            "Cursed.mp3",
            "Dark Tints - Juice WRLD.mp3",
            "Elevate - Juice WRLD.mp3",
            "Emotional Overdose.mp3",
            "Fall in love - Juice WRLD.mp3",
            "Happy Life - Juice WRLD.mp3",
            "Hypnotic.mp3",
            "In The Mix (Be Here) - Juice WRLD.mp3",
            "Tic Tac Toe - Juice WRLD.mp3",
            "Usd - Juice WRLD.mp3",
            "cali girl.mp3"

        ];


        let currentSongIndex = 0;
        let isShuffle = false;
        let isRepeat = false;


        function formatTime(seconds) {

            if (!isFinite(seconds)) {
                return "0:00";
            }

            const minutes =
                Math.floor(seconds / 60);

            const remaining =
                Math.floor(seconds % 60)
                    .toString()
                    .padStart(2, "0");

            return minutes + ":" + remaining;

        }


        function loadSong(index, autoplay = false) {

            if (!songs.length) {
                return;
            }

            currentSongIndex =
                (index + songs.length) % songs.length;

            const song =
                songs[currentSongIndex];

            musicAudio.src =
                "music/" +
                encodeURIComponent(song);

            musicNowPlaying.textContent =
                song.replace(".mp3", "");

            renderMusicList();

            if (autoplay) {

                musicAudio.play().catch(function() {});

            }

            updateMusicPlayButton();

        }


        function playPauseMusic() {

            if (!musicAudio.src) {

                loadSong(currentSongIndex, true);

                return;

            }

            if (musicAudio.paused) {

                musicAudio.play().catch(function() {});

            } else {

                musicAudio.pause();

            }

        }


        function updateMusicPlayButton() {

            musicPlay.textContent =
                musicAudio.paused ? "▶" : "❚❚";

        }


        function playNextSong() {

            if (isShuffle && songs.length > 1) {

                let nextIndex;

                do {

                    nextIndex =
                        Math.floor(
                            Math.random() * songs.length
                        );

                } while (
                    nextIndex === currentSongIndex
                );

                loadSong(nextIndex, true);

            } else {

                loadSong(
                    currentSongIndex + 1,
                    true
                );

            }

        }


        function playPreviousSong() {

            if (musicAudio.currentTime > 3) {

                musicAudio.currentTime = 0;

                return;

            }

            loadSong(
                currentSongIndex - 1,
                true
            );

        }


        function renderMusicList() {

            const search =
                musicSearch.value
                    .toLowerCase()
                    .trim();

            musicList.innerHTML = "";

            const filteredSongs =
                songs
                    .map(function(song, index) {

                        return {
                            song: song,
                            index: index
                        };

                    })
                    .filter(function(item) {

                        return item.song
                            .toLowerCase()
                            .includes(search);

                    });


            if (!filteredSongs.length) {

                musicList.innerHTML =
                    '<div class="music-empty">No songs found</div>';

                return;

            }


            filteredSongs.forEach(function(item) {

                const songElement =
                    document.createElement("div");

                songElement.className =
                    "music-song";

                if (
                    item.index === currentSongIndex
                ) {

                    songElement.classList.add(
                        "active"
                    );

                }

                songElement.textContent =
                    item.song.replace(".mp3", "");

                songElement.onclick =
                    function() {

                        loadSong(
                            item.index,
                            true
                        );

                    };

                musicList.appendChild(
                    songElement
                );

            });

        }


        function openMusicPopup() {

            quickSettings.classList.remove(
                "show"
            );

            musicPopup.classList.add(
                "show"
            );

            if (!musicAudio.src) {

                loadSong(
                    currentSongIndex,
                    false
                );

            }

        }


        function closeMusicPopup() {

            musicPopup.classList.remove(
                "show"
            );

        }


        musicPlay.addEventListener(
            "click",
            playPauseMusic
        );


        musicPrevious.addEventListener(
            "click",
            playPreviousSong
        );


        musicNext.addEventListener(
            "click",
            playNextSong
        );


        musicShuffle.addEventListener(
            "click",
            function() {

                isShuffle =
                    !isShuffle;

                musicShuffle.style.background =
                    isShuffle ? "#111" : "#eee";

                musicShuffle.style.color =
                    isShuffle ? "white" : "black";

            }
        );


        musicRepeat.addEventListener(
            "click",
            function() {

                isRepeat =
                    !isRepeat;

                musicRepeat.style.background =
                    isRepeat ? "#111" : "#eee";

                musicRepeat.style.color =
                    isRepeat ? "white" : "black";

            }
        );


        musicAudio.addEventListener(
            "play",
            updateMusicPlayButton
        );


        musicAudio.addEventListener(
            "pause",
            updateMusicPlayButton
        );


        musicAudio.addEventListener(
            "ended",
            function() {

                if (isRepeat) {

                    musicAudio.currentTime = 0;

                    musicAudio.play().catch(
                        function() {}
                    );

                } else {

                    playNextSong();

                }

            }
        );


        musicAudio.addEventListener(
            "loadedmetadata",
            function() {

                musicDuration.textContent =
                    formatTime(
                        musicAudio.duration
                    );

            }
        );


        musicAudio.addEventListener(
            "timeupdate",
            function() {

                if (
                    musicAudio.duration &&
                    isFinite(musicAudio.duration)
                ) {

                    musicProgress.value =
                        (
                            musicAudio.currentTime /
                            musicAudio.duration
                        ) * 100;

                }

                musicCurrentTime.textContent =
                    formatTime(
                        musicAudio.currentTime
                    );

            }
        );


        musicProgress.addEventListener(
            "input",
            function() {

                if (
                    musicAudio.duration &&
                    isFinite(musicAudio.duration)
                ) {

                    musicAudio.currentTime =
                        (
                            this.value / 100
                        ) *
                        musicAudio.duration;

                }

            }
        );


        musicVolume.addEventListener(
            "input",
            function() {

                musicAudio.volume =
                    this.value;

            }
        );


        musicSearch.addEventListener(
            "input",
            renderMusicList
        );


        musicPopup.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === musicPopup
                ) {

                    closeMusicPopup();

                }

            }
        );


        renderMusicList();


        /* =========================
           P KEY
           ========================= */

        window.addEventListener(
            "keydown",
            function(event) {

                if (event.code !== "KeyP") {
                    return;
                }

                if (event.repeat) {
                    return;
                }

                event.preventDefault();


                if (musicPopup.classList.contains("show")) {

                    closeMusicPopup();

                    return;

                }


                quickSettings.classList.toggle(
                    "show"
                );

            }
        );


        /* =========================
           CLICK OUTSIDE QUICK SETTINGS
           ========================= */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
