<!DOCTYPE html>
<html>
<head>
    <title>Jello</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* =========================
           MOVING BACKGROUND
           ========================= */

        .background {
            position: fixed;
            inset: -40px;

            background:
                url("assets/backround.jpg")
                center center / cover no-repeat;

            z-index: 0;

            transform: translate(0px, 0px);

            transition:
                transform 0.15s ease-out;

            pointer-events: none;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* =========================
           TITLE
           ========================= */

        h1 {
            font-size: 68px;
            margin-bottom: 30px;

            font-family: Arial, sans-serif;
            font-weight: 500;
            letter-spacing: -3px;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.45);
        }


        /* =========================
           CIRCLE BUTTONS
           ========================= */

        .circle-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 10px;
        }

        .circle-button {
            width: 75px;
            height: 75px;
            padding: 0;
            margin: 5px;

            border-radius: 50%;
            background: white;
            color: black;
            border: none;

            font-size: 32px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                background 0.2s ease,
                transform 0.2s ease,
                border-radius 0.25s ease;
        }

        .circle-button:hover {
            background: #ddd;
            transform: scale(1.08);
            border-radius: 40px;
        }

        .circle-button .letter {
            display: block;
        }

        .circle-button .name {
            display: none;
            font-size: 20px;
            font-weight: bold;
        }

        .circle-button:hover .letter {
            display: none;
        }

        .circle-button:hover .name {
            display: block;
        }

        .games-button:hover {
            width: 130px;
        }

        .movies-button:hover {
            width: 135px;
        }

        .changelog-button:hover {
            width: 155px;
        }

        .settings-button:hover {
            width: 140px;
        }


        /* =========================
           VERSION
           ========================= */

        .version {
            position: fixed;
            bottom: 15px;
            right: 15px;

            color: white;
            font-size: 14px;
            font-weight: bold;

            z-index: 2;
        }


        /* =========================
           USERNAME
           ========================= */

        .hello-user {
            position: fixed;

            top: 20px;
            left: 20px;

            color: white;

            font-size: 20px;
            font-weight: bold;

            z-index: 3;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.7);
        }


        /* =========================
           LOGIN BUTTON
           ========================= */

        .login-button {
            position: fixed;
            top: 20px;
            right: 20px;

            padding: 12px 22px;

            background: white;
            color: black;

            border: none;
            border-radius: 25px;

            font-size: 16px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            cursor: pointer;

            z-index: 3;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .login-button:hover {
            background: #ddd;
            transform: scale(1.08);
        }


        /* =========================
           LOGIN POPUP
           ========================= */

        .login-popup {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            justify-content: center;
            align-items: center;

            z-index: 10000;
        }

        .login-popup.show {
            display: flex;
        }

        .login-popup-box {
            position: relative;

            width: 330px;

            background: #101010;
            color: white;

            border: 1px solid #333;

            border-radius: 6px;

            padding: 30px;

            box-shadow:
                0 15px 60px rgba(0, 0, 0, 0.85);

            animation: loginPopupOpen 0.2s ease-out;
        }

        .login-popup-box h2 {
            margin: 0 0 6px 0;

            font-size: 30px;
            font-weight: bold;

            color: white;

            letter-spacing: -1px;
        }

        .login-subtitle {
            margin: 0 0 25px 0;

            font-size: 13px;

            color: #888;
        }

        .username-label {
            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-size: 14px;
            font-weight: bold;
        }

        .username-input {
            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            background: #080808;
            color: white;

            border: 1px solid #333;
            border-radius: 4px;

            outline: none;

            font-size: 16px;
            font-family: Arial, sans-serif;

            transition:
                border 0.15s ease,
                background 0.15s ease;
        }

        .username-input:focus {
            border-color: white;
            background: #111;
        }

        .username-input::placeholder {
            color: #666;
        }

        .sign-in-button {
            width: 100%;

            margin-top: 15px;

            padding: 13px;

            border: none;
            border-radius: 4px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .sign-in-button:hover {
            background: #ddd;
            transform: translateY(-2px);
        }

        .login-error {
            display: none;

            margin-top: 10px;

            color: #ff6b6b;

            font-size: 13px;

            text-align: center;
        }

        .close-login {
            position: absolute;

            top: 10px;
            right: 12px;

            width: 30px;
            height: 30px;

            border: none;
            border-radius: 50%;

            background: #222;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close-login:hover {
            background: #333;
            transform: scale(1.08);
        }


        /* =========================
           QUICK SETTINGS
           ========================= */

        .quick-settings {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;

            background: white;
            color: black;

            border-radius: 6px;

            padding: 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);

            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px 0;

            font-size: 25px;
            font-weight: bold;

            color: black;
        }

        .quick-setting {
            background: #f2f2f2;

            border: 1px solid #ddd;

            border-radius: 5px;

            padding: 15px;

            margin-bottom: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: black;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }


        /* =========================
           TOGGLES
           ========================= */

        .switch {
            position: relative;

            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;

            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #cfcfcf;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 19px;
            height: 19px;

            left: 3px;
            bottom: 3px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }


        /* =========================
           HINT
           ========================= */

        .hint {
            margin: 18px 0 0 0;

            color: #777;

            font-size: 13px;

            text-align: center;
        }


        /* =========================
           ANIMATIONS
           ========================= */

        @keyframes clickguiOpen {

            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes loginPopupOpen {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

    </style>
</head>

<body>

    <!-- MOVING BACKGROUND -->

    <div id="background" class="background"></div>


    <!-- HELLO USER -->

    <div id="helloUser" class="hello-user"></div>


    <div class="container">

        <h1>Jello</h1>

        <br>

        <div class="circle-buttons">

            <button
                class="circle-button games-button"
                onclick="location.href='games.html'"
            >
                <span class="letter">G</span>
                <span class="name">Games</span>
            </button>


            <button
                class="circle-button movies-button"
                onclick="location.href='movies.html'"
            >
                <span class="letter">M</span>
                <span class="name">Movies</span>
            </button>


            <button
                class="circle-button changelog-button"
                onclick="location.href='changelogs.html'"
            >
                <span class="letter">C</span>
                <span class="name">Changelogs</span>
            </button>


            <button
                class="circle-button settings-button"
                onclick="location.href='settings.html'"
            >
                <span class="letter">S</span>
                <span class="name">Settings</span>
            </button>

        </div>

    </div>


    <!-- LOGIN BUTTON -->

    <button
        id="loginButton"
        class="login-button"
        onclick="openLoginPopup()"
    >
        Log In
    </button>


    <!-- VERSION -->

    <div class="version">
        Alpha 2.01
    </div>


    <!-- LOGIN POPUP -->

    <div id="loginPopup" class="login-popup">

        <div class="login-popup-box">

            <button
                class="close-login"
                onclick="closeLoginPopup()"
            >
                ×
            </button>

            <h2>Log In</h2>

            <p class="login-subtitle">
                Enter a username to continue
            </p>

            <label
                class="username-label"
                for="usernameInput"
            >
                Username
            </label>

            <input
                id="usernameInput"
                class="username-input"
                type="text"
                maxlength="20"
                placeholder="Enter username"
                autocomplete="off"
            >

            <button
                class="sign-in-button"
                onclick="signIn()"
            >
                Sign In
            </button>

            <div
                id="loginError"
                class="login-error"
            >
                Please enter a username.
            </div>

        </div>

    </div>


    <!-- QUICK SETTINGS -->

    <div id="quickSettings" class="quick-settings">

        <div class="quick-settings-box">

            <h2>Settings</h2>


            <!-- Auto Cloak -->

            <div class="quick-setting">

                <span>Auto Cloak</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickAutoCloak"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- No Tab Close -->

            <div class="quick-setting">

                <span>No Tab Close</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickNoTabClose"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Full Screen -->

            <div class="quick-setting">

                <span>Full Screen</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickFullscreen"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Mouse Background Movement -->

            <div class="quick-setting">

                <span>Mouse Background Movement</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickMouseBackground"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <p class="hint">
                Press P to close
            </p>

        </div>

    </div>


    <script>

        /* =========================
           ELEMENTS
           ========================= */

        const quickSettings =
            document.getElementById("quickSettings");

        const quickAutoCloak =
            document.getElementById("quickAutoCloak");

        const quickNoTabClose =
            document.getElementById("quickNoTabClose");

        const quickFullscreen =
            document.getElementById("quickFullscreen");

        const quickMouseBackground =
            document.getElementById("quickMouseBackground");

        const loginPopup =
            document.getElementById("loginPopup");

        const usernameInput =
            document.getElementById("usernameInput");

        const loginError =
            document.getElementById("loginError");

        const loginButton =
            document.getElementById("loginButton");

        const helloUser =
            document.getElementById("helloUser");

        const background =
            document.getElementById("background");


        /* =========================
           LOGIN
           ========================= */

        function openLoginPopup() {

            loginPopup.classList.add("show");

            usernameInput.value = "";

            loginError.style.display = "none";

            setTimeout(function() {
                usernameInput.focus();
            }, 50);

        }


        function closeLoginPopup() {

            loginPopup.classList.remove("show");

        }


        function signIn() {

            const username =
                usernameInput.value.trim();


            if (!username) {

                loginError.style.display =
                    "block";

                usernameInput.focus();

                return;
            }


            localStorage.setItem(
                "sigmaJelloUsername",
                username
            );


            localStorage.setItem(
                "sigmaJelloLoggedIn",
                "true"
            );


            updateUserDisplay();

            closeLoginPopup();

        }


        function updateUserDisplay() {

            const username =
                localStorage.getItem(
                    "sigmaJelloUsername"
                );

            const loggedIn =
                localStorage.getItem(
                    "sigmaJelloLoggedIn"
                ) === "true";


            if (loggedIn && username) {

                helloUser.textContent =
                    "Hello " + username;

                loginButton.textContent =
                    "Logged In";

            } else {

                helloUser.textContent = "";

                loginButton.textContent =
                    "Log In";

            }

        }


        /* Load saved username */

        updateUserDisplay();


        /* Enter key signs in */

        usernameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    signIn();

                }

            }
        );


        /* Hide error while typing */

        usernameInput.addEventListener(
            "input",
            function() {

                loginError.style.display =
                    "none";

            }
        );


        /* Close login by clicking outside */

        loginPopup.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === loginPopup
                ) {

                    closeLoginPopup();

                }

            }
        );


        /* =========================
           NO TAB CLOSE
           ========================= */

        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            quickNoTabClose.checked = true;

            enableNoTabClose();

        }


        quickNoTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* =========================
           AUTO CLOAK
           ========================= */

        quickAutoCloak.addEventListener(
            "change",
            function() {

                if (!this.checked) {
                    return;
                }

                const currentURL =
                    window.location.href;

                const cloakWindow =
                    window.open(
                        "about:blank",
                        "_blank"
                    );

                if (!cloakWindow) {

                    alert(
                        "Your browser blocked the popup. Allow popups for this site."
                    );

                    this.checked = false;

                    return;
                }

                cloakWindow.document.open();

                cloakWindow.document.write(`

                    <!DOCTYPE html>

                    <html>

                    <head>

                        <title>about:blank</title>

                        <style>

                            html,
                            body {

                                margin: 0;
                                padding: 0;

                                width: 100%;
                                height: 100%;

                                overflow: hidden;

                                background: black;

                            }

                            iframe {

                                width: 100%;
                                height: 100%;

                                border: none;

                            }

                        </style>

                    </head>

                    <body>

                        <iframe
                            src="${currentURL}"
                            allowfullscreen>
                        </iframe>

                    </body>

                    </html>

                `);

                cloakWindow.document.close();

            }
        );


        /* =========================
           FULL SCREEN
           ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (document.fullscreenElement) {

                        document.exitFullscreen();

                    }

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );


        /* =========================
           MOUSE BACKGROUND MOVEMENT
           ========================= */

        let mouseBackgroundEnabled =
            localStorage.getItem("mouseBackground")
            !== "false";


        quickMouseBackground.checked =
            mouseBackgroundEnabled;


        document.addEventListener(
            "mousemove",
            function(event) {

                if (!mouseBackgroundEnabled) {
                    return;
                }

                const x =
                    (event.clientX / window.innerWidth)
                    - 0.5;

                const y =
                    (event.clientY / window.innerHeight)
                    - 0.5;

                const moveX =
                    x * 35;

                const moveY =
                    y * 35;

                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;

            }
        );


        quickMouseBackground.addEventListener(
            "change",
            function() {

                mouseBackgroundEnabled =
                    this.checked;

                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );

                if (!mouseBackgroundEnabled) {

                    background.style.transform =
                        "translate(0px, 0px)";

                }

            }
        );


        /* =========================
           P KEY
           ========================= */

        window.addEventListener(
            "keydown",
            function(event) {

                if (event.code === "KeyP") {

                    if (event.repeat)
                        return;

                    event.preventDefault();

                    quickSettings.classList.toggle(
                        "show"
                    );

                }

            }
        );


        /* =========================
           CLICK OUTSIDE
           ========================= */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
