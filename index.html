<!DOCTYPE html>
<html>
<head>
    <title>Jello</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* =========================
           MOVING BACKGROUND
           ========================= */

        .background {
            position: fixed;
            inset: -40px;

            background:
                url("assets/backround.jpg")
                center center / cover no-repeat;

            z-index: 0;

            transform: translate(0px, 0px);

            transition:
                transform 0.15s ease-out;

            pointer-events: none;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* =========================
           TITLE
           ========================= */

        h1 {
            font-size: 68px;
            margin-bottom: 30px;

            font-family: Arial, sans-serif;
            font-weight: 500;
            letter-spacing: -3px;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.45);
        }

        /* =========================
           CIRCLE BUTTONS
           ========================= */

        .circle-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 10px;
        }

        .circle-button {
            width: 75px;
            height: 75px;
            padding: 0;
            margin: 5px;

            border-radius: 50%;
            background: white;
            color: black;
            border: none;

            font-size: 32px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                background 0.2s ease,
                transform 0.2s ease,
                border-radius 0.25s ease;
        }

        .circle-button:hover {
            background: #ddd;
            transform: scale(1.08);
            border-radius: 40px;
        }

        /* =========================
           ICONS
           ========================= */

        .icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .icon svg {
            width: 38px;
            height: 38px;

            display: block;

            fill: white;
            stroke: black;

            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Games */

        .games-button .icon svg {
            width: 42px;
            height: 42px;
        }

        /* Movies */

        .movies-button .icon svg {
            width: 40px;
            height: 40px;
        }

        /* Changelogs */

        .changelog-button .icon svg {
            width: 36px;
            height: 40px;
        }

        /* Settings */

        .settings-button .icon svg {
            width: 40px;
            height: 40px;
        }

        .circle-button .name {
            display: none;

            font-size: 20px;
            font-weight: bold;
        }

        .circle-button:hover .icon {
            display: none;
        }

        .circle-button:hover .name {
            display: block;
        }

        .games-button:hover {
            width: 130px;
        }

        .movies-button:hover {
            width: 135px;
        }

        .changelog-button:hover {
            width: 155px;
        }

        .settings-button:hover {
            width: 140px;
        }

        /* =========================
           VERSION
           ========================= */

        .version {
            position: fixed;
            bottom: 15px;
            right: 15px;

            color: white;
            font-size: 14px;
            font-weight: bold;

            z-index: 2;
        }

        /* =========================
           LOGIN BUTTON
           ========================= */

        .login-button {
            position: fixed;
            top: 20px;
            right: 20px;

            padding: 12px 22px;

            background: white;
            color: black;

            border: none;
            border-radius: 25px;

            font-size: 16px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            cursor: pointer;

            z-index: 2;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .login-button:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        /* =========================
           HELLO USER
           ========================= */

        .hello-user {
            position: fixed;
            top: 20px;
            right: 20px;

            color: white;

            font-size: 20px;
            font-weight: bold;

            z-index: 3;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* =========================
           LOGIN POPUP
           ========================= */

        .login-popup {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 10000;
        }

        .login-popup.show {
            display: flex;
        }

        .login-popup-box {
            position: relative;

            width: 300px;

            background: white;
            color: black;

            border-radius: 8px;

            padding: 30px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);

            animation: loginPopupOpen 0.2s ease-out;
        }

        .login-popup-box h2 {
            margin: 0 0 12px 0;

            font-size: 26px;
            font-weight: bold;
        }

        .login-subtitle {
            margin: 0 0 20px 0 !important;

            font-size: 14px !important;
            color: #777 !important;
        }

        .username-label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;

            color: #222;
        }

        .username-input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            background: #f5f5f5;
            color: black;

            border: 1px solid #ccc;
            border-radius: 5px;

            outline: none;

            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .username-input:focus {
            border-color: #111;
            background: white;
        }

        .sign-in-button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            background: #111;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .sign-in-button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .login-error {
            display: none;

            margin-top: 10px;

            color: #d00000;

            font-size: 13px;
            font-weight: bold;
        }

        .close-login {
            position: absolute;

            top: 10px;
            right: 12px;

            width: 30px;
            height: 30px;

            border: none;
            border-radius: 50%;

            background: #eee;
            color: black;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close-login:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        /* =========================
           QUICK SETTINGS
           ========================= */

        .quick-settings {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;

            background: white;
            color: black;

            border-radius: 6px;

            padding: 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65);

            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px 0;

            font-size: 25px;
            font-weight: bold;

            color: black;
        }

        .quick-setting {
            background: #f2f2f2;

            border: 1px solid #ddd;

            border-radius: 5px;

            padding: 15px;

            margin-bottom: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: black;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }

        /* =========================
           TOGGLES
           ========================= */

        .switch {
            position: relative;

            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;

            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #cfcfcf;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 19px;
            height: 19px;

            left: 3px;
            bottom: 3px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        /* =========================
           HINT
           ========================= */

        .hint {
            margin: 18px 0 0 0;

            color: #777;

            font-size: 13px;

            text-align: center;
        }

        /* =========================
           ANIMATIONS
           ========================= */

        @keyframes clickguiOpen {

            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes loginPopupOpen {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

    </style>
</head>

<body>

    <!-- MOVING BACKGROUND -->

    <div id="background" class="background"></div>


    <div class="container">

        <h1>Jello</h1>

        <br>

        <div class="circle-buttons">

            <!-- GAMES -->

            <button
                class="circle-button games-button"
                onclick="location.href='games.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <path
                            d="M14 17h20c6 0 9 5 10 11l2 8c1 5-5 8-8 4l-5-6H15l-5 6c-3 4-9 1-8-4l2-8c1-6 4-11 10-11z"
                        />

                        <path
                            d="M14 24v9"
                            fill="none"
                        />

                        <path
                            d="M9.5 28.5h9"
                            fill="none"
                        />

                        <circle
                            cx="33"
                            cy="25"
                            r="2"
                        />

                        <circle
                            cx="38"
                            cy="30"
                            r="2"
                        />

                    </svg>

                </span>

                <span class="name">Games</span>

            </button>


            <!-- MOVIES -->

            <button
                class="circle-button movies-button"
                onclick="location.href='movies.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <rect
                            x="5"
                            y="9"
                            width="38"
                            height="30"
                            rx="4"
                            ry="4"
                        />

                        <path
                            d="M5 18h38"
                            fill="none"
                        />

                        <path
                            d="M12 9l5 9"
                            fill="none"
                        />

                        <path
                            d="M22 9l5 9"
                            fill="none"
                        />

                        <path
                            d="M32 9l5 9"
                            fill="none"
                        />

                        <path
                            d="M20 24l11 5-11 5z"
                        />

                    </svg>

                </span>

                <span class="name">Movies</span>

            </button>


            <!-- CHANGELOGS -->

            <button
                class="circle-button changelog-button"
                onclick="location.href='changelogs.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <path
                            d="M10 5h21l7 7v31H10z"
                        />

                        <path
                            d="M31 5v8h7"
                            fill="none"
                        />

                        <path
                            d="M17 22h15"
                            fill="none"
                        />

                        <path
                            d="M17 29h15"
                            fill="none"
                        />

                        <path
                            d="M17 36h10"
                            fill="none"
                        />

                    </svg>

                </span>

                <span class="name">Changelogs</span>

            </button>


            <!-- SETTINGS -->

            <button
                class="circle-button settings-button"
                onclick="location.href='settings.html'"
            >
                <span class="icon">

                    <svg viewBox="0 0 48 48" aria-hidden="true">

                        <path
                            d="
                                M20 5
                                h8
                                l1.5 5
                                a14 14 0 0 1 4 2.3
                                l5-1.5
                                4 7
                                -4 3
                                a14 14 0 0 1 0 4.6
                                l4 3
                                -4 7
                                -5-1.5
                                a14 14 0 0 1-4 2.3
                                L28 43
                                h-8
                                l-1.5-5
                                a14 14 0 0 1-4-2.3
                                l-5 1.5
                                -4-7
                                4-3
                                a14 14 0 0 1 0-4.6
                                l-4-3
                                4-7
                                5 1.5
                                a14 14 0 0 1 4-2.3
                                z
                            "
                        />

                        <circle
                            cx="24"
                            cy="24"
                            r="6"
                        />

                    </svg>

                </span>

                <span class="name">Settings</span>

            </button>

        </div>

    </div>


    <!-- HELLO USER -->

    <div id="helloUser" class="hello-user"></div>


    <!-- LOGIN BUTTON -->

    <button
        id="loginButton"
        class="login-button"
        onclick="openLoginPopup()"
    >
        Log In
    </button>


    <!-- VERSION -->

    <div class="version">
        Alpha 2.01
    </div>


    <!-- LOGIN POPUP -->

    <div id="loginPopup" class="login-popup">

        <div class="login-popup-box">

            <button
                class="close-login"
                onclick="closeLoginPopup()"
            >
                ×
            </button>

            <h2>Log In</h2>

            <p class="login-subtitle">
                Enter a username to continue
            </p>

            <label
                class="username-label"
                for="usernameInput"
            >
                Username
            </label>

            <input
                id="usernameInput"
                class="username-input"
                type="text"
                maxlength="20"
                placeholder="Enter username"
                autocomplete="off"
            >

            <button
                class="sign-in-button"
                onclick="signIn()"
            >
                Sign In
            </button>

            <div
                id="loginError"
                class="login-error"
            >
                Please enter a username.
            </div>

        </div>

    </div>


    <!-- QUICK SETTINGS -->

    <div id="quickSettings" class="quick-settings">

        <div class="quick-settings-box">

            <h2>Settings</h2>

            <!-- Auto Cloak -->

            <div class="quick-setting">

                <span>Auto Cloak</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickAutoCloak"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <!-- No Tab Close -->

            <div class="quick-setting">

                <span>No Tab Close</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickNoTabClose"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <!-- Full Screen -->

            <div class="quick-setting">

                <span>Full Screen</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickFullscreen"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <!-- Mouse Background Movement -->

            <div class="quick-setting">

                <span>Mouse Background Movement</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickMouseBackground"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <p class="hint">
                Press P to close
            </p>

        </div>

    </div>


    <script>

        /* =========================
           ELEMENTS
           ========================= */

        const quickSettings =
            document.getElementById("quickSettings");

        const quickAutoCloak =
            document.getElementById("quickAutoCloak");

        const quickNoTabClose =
            document.getElementById("quickNoTabClose");

        const quickFullscreen =
            document.getElementById("quickFullscreen");

        const quickMouseBackground =
            document.getElementById("quickMouseBackground");

        const loginPopup =
            document.getElementById("loginPopup");

        const usernameInput =
            document.getElementById("usernameInput");

        const loginError =
            document.getElementById("loginError");

        const loginButton =
            document.getElementById("loginButton");

        const helloUser =
            document.getElementById("helloUser");

        const background =
            document.getElementById("background");


        /* =========================
           LOGIN
           ========================= */

        function openLoginPopup() {

            loginPopup.classList.add("show");

            usernameInput.value = "";

            loginError.style.display = "none";

            setTimeout(function() {

                usernameInput.focus();

            }, 50);

        }


        function closeLoginPopup() {

            loginPopup.classList.remove("show");

        }


        function signIn() {

            const username =
                usernameInput.value.trim();


            if (!username) {

                loginError.style.display =
                    "block";

                usernameInput.focus();

                return;

            }


            localStorage.setItem(
                "sigmaJelloUsername",
                username
            );


            localStorage.setItem(
                "sigmaJelloLoggedIn",
                "true"
            );


            updateUserDisplay();

            closeLoginPopup();

        }


        function updateUserDisplay() {

            const username =
                localStorage.getItem(
                    "sigmaJelloUsername"
                );


            const loggedIn =
                localStorage.getItem(
                    "sigmaJelloLoggedIn"
                ) === "true";


            if (loggedIn && username) {

                helloUser.textContent =
                    "Hello " + username;

                helloUser.style.display =
                    "block";

                loginButton.style.display =
                    "none";

            } else {

                helloUser.textContent = "";

                helloUser.style.display =
                    "none";

                loginButton.style.display =
                    "block";

            }

        }


        updateUserDisplay();


        usernameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    signIn();

                }

            }
        );


        usernameInput.addEventListener(
            "input",
            function() {

                loginError.style.display =
                    "none";

            }
        );


        loginPopup.addEventListener(
            "click",
            function(event) {

                if (event.target === loginPopup) {

                    closeLoginPopup();

                }

            }
        );


        /* =========================
           NO TAB CLOSE
           ========================= */

        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            quickNoTabClose.checked = true;

            enableNoTabClose();

        }


        quickNoTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* =========================
           AUTO CLOAK
           ========================= */

        quickAutoCloak.addEventListener(
            "change",
            function() {

                if (!this.checked) {
                    return;
                }

                const currentURL =
                    window.location.href;

                const cloakWindow =
                    window.open(
                        "about:blank",
                        "_blank"
                    );

                if (!cloakWindow) {

                    alert(
                        "Your browser blocked the popup. Allow popups for this site."
                    );

                    this.checked = false;

                    return;
                }

                cloakWindow.document.open();

                cloakWindow.document.write(`

                    <!DOCTYPE html>

                    <html>

                    <head>

                        <title>about:blank</title>

                        <style>

                            html,
                            body {

                                margin: 0;
                                padding: 0;

                                width: 100%;
                                height: 100%;

                                overflow: hidden;

                                background: black;

                            }

                            iframe {

                                width: 100%;
                                height: 100%;

                                border: none;

                            }

                        </style>

                    </head>

                    <body>

                        <iframe
                            src="${currentURL}"
                            allowfullscreen>
                        </iframe>

                    </body>

                    </html>

                `);

                cloakWindow.document.close();

            }
        );


        /* =========================
           FULL SCREEN
           ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (document.fullscreenElement) {

                        document.exitFullscreen();

                    }

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );


        /* =========================
           MOUSE BACKGROUND MOVEMENT
           ========================= */

        let mouseBackgroundEnabled =
            localStorage.getItem("mouseBackground")
            !== "false";


        quickMouseBackground.checked =
            mouseBackgroundEnabled;


        document.addEventListener(
            "mousemove",
            function(event) {

                if (!mouseBackgroundEnabled) {
                    return;
                }

                const x =
                    (event.clientX / window.innerWidth)
                    - 0.5;

                const y =
                    (event.clientY / window.innerHeight)
                    - 0.5;

                const moveX =
                    x * 35;

                const moveY =
                    y * 35;

                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;

            }
        );


        quickMouseBackground.addEventListener(
            "change",
            function() {

                mouseBackgroundEnabled =
                    this.checked;

                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );

                if (!mouseBackgroundEnabled) {

                    background.style.transform =
                        "translate(0px, 0px)";

                }

            }
        );


        /* =========================
           P KEY
           ========================= */

        window.addEventListener(
            "keydown",
            function(event) {

                if (event.code === "KeyP") {

                    if (event.repeat)
                        return;

                    event.preventDefault();

                    quickSettings.classList.toggle(
                        "show"
                    );

                }

            }
        );


        /* =========================
           CLICK OUTSIDE
           ========================= */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
