<!DOCTYPE html>
<html>
<head>
    <title>Sigma Jello - Games</title>

    <style>
        body {
            margin: 0;
            background: url("assets/backroundjello.png") center center / cover no-repeat fixed;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        /* =========================
           GAME BUTTONS
        ========================= */

        .game-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 35px;
        }

        .game-button {
            width: 85px;
            height: 85px;
            padding: 0;
            margin: 5px;

            border-radius: 50%;
            border: none;

            background: white;
            color: black;

            font-size: 30px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
        }

        .game-button:hover {
            background: #ddd;
            transform: scale(1.08);
            border-radius: 45px;
        }

        .game-button .game-letter {
            display: block;
        }

        .game-button .game-name {
            display: none;
            font-size: 18px;
            font-weight: bold;
        }

        .game-button:hover .game-letter {
            display: none;
        }

        .game-button:hover .game-name {
            display: block;
        }

        .eaglercraft-button:hover {
            width: 210px;
        }

        .btd5-button:hover {
            width: 160px;
        }

        .terraria-button:hover {
            width: 130px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;

            width: 65px;
            height: 65px;

            padding: 0;
            margin: 0;

            border-radius: 50%;
            border: none;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
        }

        .back-button:hover {
            width: 115px;
            background: #ddd;
            transform: scale(1.08);
            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;
            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }


        /* =========================
           QUICK SETTINGS
        ========================= */

        .quick-settings {
            display: none;
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;

            background: white;
            color: black;

            border-radius: 6px;
            padding: 25px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65);

            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px 0;

            font-size: 25px;
            font-weight: bold;

            color: black;
        }


        /* Setting Rows */

        .quick-setting {
            background: #f2f2f2;

            border: 1px solid #ddd;
            border-radius: 5px;

            padding: 15px;
            margin-bottom: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: black;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }


        /* Toggle Switch */

        .switch {
            position: relative;

            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;

            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            background: #cfcfcf;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 19px;
            height: 19px;

            left: 3px;
            bottom: 3px;

            background: white;

            border-radius: 50%;

            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }


        /* Hint */

        .hint {
            margin: 18px 0 0 0;

            color: #777;

            font-size: 13px;

            text-align: center;
        }


        /* Open Animation */

        @keyframes clickguiOpen {

            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

    </style>
</head>

<body>

    <h1>Games</h1>


    <!-- Game Buttons -->

    <div class="game-buttons">

        <!-- Eaglercraft 1.5.2 -->

        <button
            class="game-button eaglercraft-button"
            onclick="launchEaglercraft()"
        >
            <span class="game-letter">E</span>
            <span class="game-name">Eaglercraft 1.5.2</span>
        </button>


        <!-- Bloons TD 5 -->

        <button
            class="game-button btd5-button"
            onclick="location.href='assets/jello/btd5.html'"
        >
            <span class="game-letter">B</span>
            <span class="game-name">Bloons TD 5</span>
        </button>


        <!-- Terraria -->

        <button
            class="game-button terraria-button"
            onclick="location.href='assets/jello/terraria.html'"
        >
            <span class="game-letter">T</span>
            <span class="game-name">Terraria</span>
        </button>

    </div>


    <!-- Back Button -->

    <button
        class="back-button"
        onclick="location.href='index.html'"
    >
        <span class="back-letter">←</span>
        <span class="back-text">Back</span>
    </button>


    <!-- Quick Settings -->

    <div id="quickSettings" class="quick-settings">

        <div class="quick-settings-box">

            <h2>Settings</h2>


            <!-- No Tab Close -->

            <div class="quick-setting">

                <span>No Tab Close</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickNoTabClose"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Full Screen -->

            <div class="quick-setting">

                <span>Full Screen</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickFullscreen"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <p class="hint">
                Press P to close
            </p>

        </div>

    </div>


    <script>

        /* =========================
           EAGLERCRAFT LAUNCHER
        ========================= */

        function launchEaglercraft() {

            /*
             * Open a new tab at about:blank.
             * Because this happens directly from the
             * button click, browsers should allow it.
             */

            const gameWindow =
                window.open("about:blank", "_blank");


            /*
             * If the browser blocked the new tab,
             * tell the user what happened.
             */

            if (!gameWindow) {

                alert(
                    "Please allow pop-ups for Sigma Jello."
                );

                return;

            }


            /*
             * Find the Eaglercraft file relative
             * to the current Sigma Jello website.
             *
             * This works on:
             * GitHub Pages
             * Cloudflare Pages
             * Netlify
             * localhost
             * custom domains
             */

            const gameURL =
                new URL(
                    "assets/jello/1.5.2.html",
                    window.location.href
                ).href;


            /*
             * Create the about:blank page.
             */

            gameWindow.document.open();


            gameWindow.document.write(`

                <!DOCTYPE html>

                <html>

                <head>

                    <title>about:blank</title>

                    <style>

                        html,
                        body {

                            margin: 0;
                            padding: 0;

                            width: 100%;
                            height: 100%;

                            overflow: hidden;

                            background: black;

                        }


                        iframe {

                            width: 100%;
                            height: 100%;

                            border: none;

                            display: block;

                        }

                    </style>

                </head>


                <body>

                    <iframe
                        src="${gameURL}"
                        allowfullscreen>
                    </iframe>

                </body>

                </html>

            `);


            gameWindow.document.close();

        }


        /* =========================
           QUICK SETTINGS
        ========================= */

        const quickSettings =
            document.getElementById("quickSettings");

        const quickNoTabClose =
            document.getElementById("quickNoTabClose");

        const quickFullscreen =
            document.getElementById("quickFullscreen");


        /* =========================
           NO TAB CLOSE
        ========================= */

        function enableNoTabClose() {

            window.onbeforeunload = function(event) {

                event.preventDefault();

                event.returnValue = "";

                return "";

            };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        /* Load saved setting */

        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            quickNoTabClose.checked = true;

            enableNoTabClose();

        }


        /* Save setting */

        quickNoTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* =========================
           FULL SCREEN
        ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                        .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (document.fullscreenElement) {

                        document.exitFullscreen();

                    }

                }

            }
        );


        /* Sync Full Screen */

        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );


        /* =========================
           P KEY
        ========================= */

        window.addEventListener(
            "keydown",
            function(event) {

                if (event.code === "KeyP") {

                    if (event.repeat) return;

                    event.preventDefault();

                    quickSettings.classList.toggle(
                        "show"
                    );

                }

            }
        );


        /* =========================
           CLICK OUTSIDE
        ========================= */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
