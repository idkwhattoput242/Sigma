<!DOCTYPE html>
<html>
<head>
    <title>Jello Portal</title>

    <style>

        body {
            margin: 0;

            background: #000;
            color: white;

            font-family:
                "Helvetica Neue",
                "Segoe UI",
                Arial,
                sans-serif;

            overflow: hidden;
        }


        /* =========================
           MOVING BACKGROUND
           ========================= */

        .background {
            position: fixed;

            inset: -40px;

            background:
                url("assets/backroundjello.png")
                center center / cover no-repeat;

            z-index: 0;

            transform:
                translate(0px, 0px);

            transition:
                transform 0.15s ease-out;

            pointer-events: none;
        }


        /* =========================
           CONTENT
           ========================= */

        .container {
            position: relative;

            z-index: 1;

            width: 100%;
            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }


        /* =========================
           TITLE
           ========================= */

        h1 {
            margin: 0 0 12px 0;

            font-size: 64px;

            font-family:
                "Segoe UI Light",
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-weight: 300;

            letter-spacing: -3px;

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.5);
        }


        .subtitle {
            margin: 0;

            font-size: 16px;

            color:
                rgba(255, 255, 255, 0.75);

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.5);
        }


        /* =========================
           PORTAL AREA
           ========================= */

        .portal-box {
            width: 500px;

            max-width:
                calc(100vw - 40px);

            margin-top: 30px;

            padding: 25px;

            box-sizing: border-box;

            background:
                rgba(0, 0, 0, 0.45);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 10px;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.45);
        }


        .portal-box h2 {
            margin: 0 0 10px 0;

            font-size: 24px;

            font-weight: bold;
        }


        .portal-box p {
            margin: 0;

            color:
                rgba(255, 255, 255, 0.65);

            font-size: 14px;
        }


        /* =========================
           BACK BUTTON
           ========================= */

        .back-button {
            position: fixed;

            bottom: 20px;
            left: 20px;

            width: 58px;
            height: 58px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.96);

            color: #222;

            cursor: pointer;

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            white-space: nowrap;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.25);

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                border-radius 0.25s ease,
                background 0.2s ease;
        }


        .back-button:hover {
            width: 120px;

            background: white;

            transform:
                scale(1.08);

            border-radius: 35px;

            box-shadow:
                0 8px 24px
                rgba(0, 0, 0, 0.35);
        }


        .back-icon {
            width: 32px;
            height: 32px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }


        .back-icon svg {
            width: 30px;
            height: 30px;

            fill: none;

            stroke: #222;

            stroke-width: 2.5;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        .back-button .back-name {
            display: none;

            font-size: 17px;

            font-weight: bold;
        }


        .back-button:hover .back-icon {
            display: none;
        }


        .back-button:hover .back-name {
            display: block;
        }


        /* =========================
           VERSION
           ========================= */

        .version {
            position: fixed;

            bottom: 15px;
            right: 15px;

            color: white;

            font-size: 14px;

            font-weight: bold;

            z-index: 2;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.6);
        }

    </style>
</head>


<body>


    <!-- BACKGROUND -->

    <div
        id="background"
        class="background">
    </div>


    <!-- MAIN CONTENT -->

    <div class="container">

        <h1>
            Jello Portal
        </h1>

        <p class="subtitle">
            Welcome to the Jello Portal
        </p>


        <div class="portal-box">

            <h2>
                Portal
            </h2>

            <p>
                Portal features will be added here.
            </p>

        </div>

    </div>


    <!-- BACK BUTTON -->

    <button
        class="back-button"
        onclick="location.href='index.html'"
    >

        <span class="back-icon">

            <svg
                viewBox="0 0 48 48"
                aria-hidden="true"
            >

                <path
                    d="M30 10L16 24L30 38"
                />

                <path
                    d="M17 24H38"
                />

            </svg>

        </span>


        <span class="back-name">
            Back
        </span>

    </button>


    <div class="version">
        5.0 beta
    </div>


    <script>

        /* =========================
           MOUSE BACKGROUND MOVEMENT
           ========================= */

        const background =
            document.getElementById(
                "background"
            );


        document.addEventListener(
            "mousemove",
            function(event) {

                const x =
                    (event.clientX /
                    window.innerWidth) - 0.5;

                const y =
                    (event.clientY /
                    window.innerHeight) - 0.5;


                const moveX =
                    x * 35;

                const moveY =
                    y * 35;


                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;

            }
        );

    </script>

</body>
</html>
