<!-- =========================
     QUICK SETTINGS + BACKGROUND
     ========================= -->

<script>

    /* =========================
       ELEMENTS
       ========================= */

    const background =
        document.getElementById(
            "background"
        );


    const quickSettings =
        document.getElementById(
            "quickSettings"
        );


    const noTabCloseToggle =
        document.getElementById(
            "noTabCloseToggle"
        );


    const fullScreenToggle =
        document.getElementById(
            "fullScreenToggle"
        );


    const mouseBackgroundToggle =
        document.getElementById(
            "mouseBackgroundToggle"
        );


    const musicButton =
        document.getElementById(
            "musicButton"
        );


    const musicWindow =
        document.getElementById(
            "musicWindow"
        );


    const musicFrame =
        document.getElementById(
            "musicFrame"
        );


    /* =========================
       LOAD SAVED SETTINGS
       ========================= */

    noTabCloseToggle.checked =
        localStorage.getItem(
            "noTabClose"
        ) === "true";


    mouseBackgroundToggle.checked =
        localStorage.getItem(
            "mouseBackground"
        ) !== "false";


    /* =========================
       QUICK SETTINGS
       ========================= */

    function toggleQuickSettings() {

        quickSettings.classList.toggle(
            "open"
        );

    }


    /* =========================
       P KEY
       ========================= */

    document.addEventListener(
        "keydown",
        function(event) {

            /*
             * Don't open Quick Settings
             * while typing in chat.
             */

            if (
                event.target.tagName ===
                "INPUT" ||
                event.target.tagName ===
                "TEXTAREA"
            ) {

                return;

            }


            if (
                event.key.toLowerCase() ===
                "p"
            ) {

                event.preventDefault();

                toggleQuickSettings();

            }

        }
    );


    /* =========================
       NO TAB CLOSE
       ========================= */

    function updateNoTabClose() {

        if (
            noTabCloseToggle.checked
        ) {

            localStorage.setItem(
                "noTabClose",
                "true"
            );


            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        } else {

            localStorage.setItem(
                "noTabClose",
                "false"
            );


            window.onbeforeunload =
                null;

        }

    }


    noTabCloseToggle.addEventListener(
        "change",
        updateNoTabClose
    );


    updateNoTabClose();


    /* =========================
       FULL SCREEN
       ========================= */

    fullScreenToggle.addEventListener(
        "change",
        async function() {

            if (
                fullScreenToggle.checked
            ) {

                try {

                    await document
                        .documentElement
                        .requestFullscreen();

                } catch (error) {

                    console.error(
                        "Fullscreen error:",
                        error
                    );

                    fullScreenToggle.checked =
                        false;

                }

            } else {

                try {

                    if (
                        document.fullscreenElement
                    ) {

                        await document
                            .exitFullscreen();

                    }

                } catch (error) {

                    console.error(
                        "Exit fullscreen error:",
                        error
                    );

                }

            }

        }
    );


    /* =========================
       FULLSCREEN STATE
       ========================= */

    document.addEventListener(
        "fullscreenchange",
        function() {

            fullScreenToggle.checked =
                !!document.fullscreenElement;

        }
    );


    /* =========================
       MOUSE BACKGROUND
       ========================= */

    mouseBackgroundToggle.addEventListener(
        "change",
        function() {

            localStorage.setItem(
                "mouseBackground",
                mouseBackgroundToggle.checked
            );


            if (
                !mouseBackgroundToggle.checked
            ) {

                background.style.transform =
                    "translate(0px, 0px)";

            }

        }
    );


    /* =========================
       BACKGROUND MOVEMENT
       ========================= */

    document.addEventListener(
        "mousemove",
        function(event) {

            if (
                !mouseBackgroundToggle.checked
            ) {

                return;

            }


            const x =
                (
                    event.clientX /
                    window.innerWidth
                ) - 0.5;


            const y =
                (
                    event.clientY /
                    window.innerHeight
                ) - 0.5;


            const moveX =
                x * 35;


            const moveY =
                y * 35;


            background.style.transform =
                `translate(${moveX}px, ${moveY}px)`;

        }
    );


    /* =========================
       JELLO MUSIC
       ========================= */

    musicButton.addEventListener(
        "click",
        function() {

            musicFrame.src =
                "music.html";


            musicWindow.classList.add(
                "open"
            );


            quickSettings.classList.remove(
                "open"
            );

        }
    );


    /* =========================
       COPY IP
       ========================= */

    window.copyIP =
        function(ip, button) {

            navigator.clipboard
                .writeText(ip)
                .then(function() {

                    const oldText =
                        button.textContent;


                    button.textContent =
                        "Copied!";


                    setTimeout(
                        function() {

                            button.textContent =
                                oldText;

                        },
                        1200
                    );

                })
                .catch(function() {

                    alert(
                        "Server IP: " +
                        ip
                    );

                });

        };

</script>
