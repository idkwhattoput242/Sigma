<script type="module">

    import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        onChildAdded
    } from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    /* =========================
       FIREBASE CONFIG
       ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyAIZJ7mReibw8J48F6yRut7GQAqWMalN-E",

        authDomain:
            "sigma-jello.firebaseapp.com",

        databaseURL:
            "https://sigma-jello-default-rtdb.firebaseio.com",

        projectId:
            "sigma-jello",

        storageBucket:
            "sigma-jello.firebasestorage.app",

        messagingSenderId:
            "643520880930",

        appId:
            "1:643520880930:web:2d06c3244f500be039c57b"

    };


    /* =========================
       START FIREBASE
       ========================= */

    const app =
        initializeApp(firebaseConfig);


    const database =
        getDatabase(app);


    const chatRef =
        ref(database, "jelloChat");


    /* =========================
       ELEMENTS
       ========================= */

    const chatInput =
        document.getElementById("chatInput");

    const chatMessages =
        document.getElementById("chatMessages");


    /* =========================
       SEND MESSAGE
       ========================= */

    window.sendMessage = function() {

        const text =
            chatInput.value.trim();


        if (!text) {
            return;
        }


        let username =
            localStorage.getItem(
                "sigmaJelloUsername"
            );


        if (!username) {
            username = "Guest";
        }


        push(chatRef, {

            username: username,

            message: text,

            timestamp:
                Date.now()

        });


        chatInput.value = "";

    };


    /* =========================
       RECEIVE MESSAGES
       ========================= */

    onChildAdded(
        chatRef,
        function(snapshot) {

            const data =
                snapshot.val();


            if (!data) {
                return;
            }


            const message =
                document.createElement("div");

            message.className =
                "message";


            const name =
                document.createElement("div");

            name.className =
                "message-name";

            name.textContent =
                data.username || "Guest";


            const messageText =
                document.createElement("div");

            messageText.className =
                "message-text";

            messageText.textContent =
                data.message || "";


            message.appendChild(name);

            message.appendChild(messageText);

            chatMessages.appendChild(message);


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }
    );


    /* =========================
       ENTER TO SEND
       ========================= */

    chatInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                window.sendMessage();

            }

        }
    );

</script>
